<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meow-PDF</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%23dbbe43%22/%3E%3Cg transform=%22translate(4 4) scale(1)%22 fill=%22none%22 stroke=%22%231b1b1b%22 stroke-width=%221.9%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Cpath d=%22M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z%22/%3E%3Cpath d=%22M8 14v.5%22/%3E%3Cpath d=%22M16 14v.5%22/%3E%3Cpath d=%22M11.25 16.25h1.5L12 17l-.75-.75Z%22/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="dark"]{
  color-scheme: dark;
  --font: "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
  --view:#232323;
  --bar:#2e2e2e;
  --bar2:#272727;
  --side:#272727;
  --text:#ececec;
  --muted:#9a9a9a;
  --border:#434343;
  --hover:rgba(255,255,255,.08);
  --accent:#dbbe43;
  --accent-bg:rgba(219,190,67,.2);
  --on-accent:#2a2200;
  --main:#dbbe43;
  --on-main:#2a2200;
  --danger:#f28b82;
  --dialog:#383838;
  --shadow:0 2px 10px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  color-scheme: light;
  --view:#e6e6e6;
  --bar:#ffffff;
  --bar2:#f4f4f4;
  --side:#f4f4f4;
  --text:#222222;
  --muted:#666666;
  --border:#d6d6d6;
  --hover:rgba(0,0,0,.07);
  --accent:#8a7410;
  --accent-bg:rgba(219,190,67,.3);
  --on-accent:#ffffff;
  --main:#dbbe43;
  --on-main:#2a2200;
  --danger:#d93025;
  --dialog:#ffffff;
  --shadow:0 2px 10px rgba(0,0,0,.18);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--view);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;flex:none;display:block}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100%}

/* ── 상단 타이틀 바 ── */
.titlebar{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--border);flex:none}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--text)}
.icon-btn:hover{background:var(--hover)}
.icon-btn.on{background:var(--accent-bg);color:var(--accent)}
.doc-name{font-weight:500;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dirty-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.pager{display:flex;align-items:center;gap:6px;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.pager input{width:46px;height:28px;text-align:center;background:var(--bar2);color:var(--text);border:1px solid var(--border);border-radius:6px;font:inherit;-moz-appearance:textfield}
.pager input::-webkit-outer-spin-button,.pager input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.spacer{flex:1}
.text-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;color:var(--text)}
.text-btn:hover{background:var(--hover)}
.text-btn svg{width:18px;height:18px}

/* ── 도구 모음 ── */
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--border);overflow-x:auto;flex:none;scrollbar-width:thin}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:54px;height:52px;padding:0 8px;border-radius:10px;font-size:11px;white-space:nowrap;color:var(--text);flex:none}
.tool svg{width:20px;height:20px}
.tool:hover{background:var(--hover)}
.tool.active{background:var(--accent-bg);color:var(--accent)}
.tool:disabled{opacity:.35;pointer-events:none}
.tool.primary{background:var(--main);color:var(--on-main);font-weight:500}
.tool.primary:hover{filter:brightness(1.08)}
.sep{width:1px;height:30px;background:var(--border);margin:0 6px;flex:none}
.no-doc .needs-doc{opacity:.38;pointer-events:none}

/* ── 옵션 바 ── */
.optbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;min-height:44px;padding:5px 12px;background:var(--bar2);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);flex:none}
.optbar .grp{display:flex;align-items:center;gap:6px}
.optbar label{color:var(--muted)}
.optbar .val{min-width:28px;color:var(--text);font-variant-numeric:tabular-nums}
.swatch{width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid var(--border);flex:none}
.swatch.on{outline:2px solid var(--accent);outline-offset:2px}
.optbar input[type=color]{width:26px;height:26px;padding:0;border:2px solid var(--border);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.optbar input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.optbar input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.optbar input[type=range]{width:84px;accent-color:var(--accent)}
.optbar .val{min-width:34px;text-align:right}
.optbar .rg{gap:5px}
.seg{display:flex;gap:2px;padding:2px;background:var(--bar);border:1px solid var(--border);border-radius:10px}
.seg button{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;color:var(--text);font-size:12.5px}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--accent-bg);color:var(--accent)}
.chip{padding:3px 10px;border-radius:999px;background:var(--accent-bg);color:var(--accent)}
.danger-btn{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;color:var(--danger);border:1px solid var(--border)}
.danger-btn:hover{background:var(--hover)}
.danger-btn svg{width:16px;height:16px}

/* ── 본문 ── */
.main{flex:1;display:flex;min-height:0;position:relative}
#sidebar{position:relative;width:var(--sbw,200px);flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--border);z-index:30}
.sidebar-off #sidebar{display:none}
.side-head{padding:12px 14px 6px;font-weight:500;display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
.thumbs{flex:1;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;align-items:stretch;gap:12px;scrollbar-width:thin}
.thumb{position:relative;width:var(--tw,128px);margin-left:calc(var(--d,0) * 12px + 8px);cursor:pointer;flex:none}
.thumb-page{position:relative;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);outline:2px solid transparent;outline-offset:2px;border-radius:2px}
.thumb.active .thumb-page{outline-color:var(--accent)}
.thumb:hover .thumb-page{outline-color:var(--border)}
.thumb.active:hover .thumb-page{outline-color:var(--accent)}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.thumb-num{text-align:center;font-size:12px;color:var(--muted);margin-top:7px}
.thumb.active .thumb-num{color:var(--accent);font-weight:500}
.thumb-actions{position:absolute;top:6px;right:6px;display:flex;gap:4px;opacity:0;transition:opacity .12s}
.thumb:hover .thumb-actions,.thumb:focus-within .thumb-actions{opacity:1}
@media (hover:none){.thumb-actions{opacity:1}}
.thumb-actions button{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:rgba(32,33,36,.88);color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.thumb-actions button:hover{background:var(--main);color:var(--on-main)}
.thumb-actions button.del:hover{background:var(--danger);color:#fff}
.thumb-actions svg{width:15px;height:15px}
.thumb.dragging{opacity:.4}
.thumb.drop-before::before,.thumb.drop-after::after{content:'';position:absolute;left:-4px;right:-4px;height:3px;border-radius:2px;background:var(--accent)}
.thumb.drop-before::before{top:-9px}
.thumb.drop-after::after{bottom:-9px}
.side-foot{padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.side-foot button{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;height:36px;border-radius:9px;border:1px solid var(--border);color:var(--text)}
.side-foot button:hover{background:var(--hover)}
.side-foot svg{width:17px;height:17px}

.stage{position:relative;flex:1;min-width:0;overflow:hidden}
.viewer{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;background:var(--view)}
#pages{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 24px 90px;min-width:min-content}
.page{position:relative;flex:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.3)}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.page .over{touch-action:pan-y}
.tool-pen .page .over,.tool-line .page .over,.tool-highlight .page .over,.tool-shape .page .over,.tool-eraser .page .over{touch-action:none}
.tool-shape .over{cursor:crosshair}
.tool-pen .over,.tool-line .over,.tool-highlight .over{cursor:var(--brush-cursor,crosshair)}
.tool-text .over{cursor:text}
.tool-eraser .over{cursor:var(--eraser-cursor,crosshair)}
.text-editor{position:absolute;margin:0;padding:0;border:0;outline:1.5px dashed var(--accent);outline-offset:2px;background:rgba(255,255,255,.55);resize:none;overflow:hidden;white-space:pre;font-family:var(--font);line-height:1.25;z-index:5;min-width:20px}

.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;transform-origin:0 0;pointer-events:none;-webkit-user-select:none;user-select:none}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;transform-origin:0 0}
.textLayer ::selection{background:rgba(219,190,67,.45)}
.tool-select .textLayer{pointer-events:auto;-webkit-user-select:text;user-select:text}
.tool-select .textLayer span{cursor:text}
.tool-select .page .over{pointer-events:none}
.spread-on #pages{display:grid;grid-template-columns:repeat(2,max-content);justify-content:center;align-items:center;gap:16px}
.opt-btn{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;border:1px solid var(--border);color:var(--text)}
.opt-btn:hover{background:var(--hover)}
.zsep{width:1px;height:20px;background:var(--border);margin:0 4px}
.zoombar .icon-btn{width:32px;height:32px}
#layers{position:relative;width:var(--lyw,232px);flex:none;display:flex;flex-direction:column;background:var(--side);border-left:1px solid var(--border);z-index:30}
.layers-off #layers{display:none}
.layer-list{flex:1;overflow-y:auto;padding:6px 8px 12px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin}
.layer{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;flex:none}
.layer:hover{background:var(--hover)}
.layer.sel{background:var(--accent-bg);border-color:var(--accent)}
.layer .l-ico{color:var(--muted);display:grid}
.layer .l-ico svg{width:17px;height:17px}
.layer .l-dot{width:11px;height:11px;border-radius:50%;background:var(--c);border:1px solid var(--border);flex:none}
.layer .l-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.layer.off .l-name,.layer.off .l-ico,.layer.off .l-dot{opacity:.4}
.l-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--muted);flex:none}
.l-btn:hover{background:var(--hover);color:var(--text)}
.l-btn svg{width:16px;height:16px}
.layer.dragging{opacity:.4}
.layer.drop-before::before,.layer.drop-after::after{content:'';position:absolute;left:4px;right:4px;height:3px;border-radius:2px;background:var(--accent)}
.layer.drop-before::before{top:-3px}
.layer.drop-after::after{bottom:-3px}
.layer-empty{padding:18px 14px;color:var(--muted);font-size:12.5px;line-height:1.7}
.tool{position:relative}
.tool kbd{position:absolute;top:3px;right:5px;font:inherit;font-size:9.5px;line-height:1;color:var(--muted);text-transform:uppercase;pointer-events:none}
.tool.active kbd{color:var(--accent)}
.tool.primary kbd{color:inherit}
.brand{display:grid;place-items:center;width:34px;height:34px;color:var(--accent);margin-right:14px;flex:none}
.brand svg{width:27px;height:27px}
.optbar select{height:30px;max-width:170px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--bar);color:var(--text);font:inherit}
.fmt{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);color:var(--text);font-size:14px;line-height:1}
.fmt:hover{background:var(--hover)}
.fmt.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.clock{font-variant-numeric:tabular-nums;color:var(--text);padding:0 10px;font-size:13.5px;letter-spacing:.02em;white-space:nowrap}
.splitbtn{display:flex;align-items:stretch;flex:none}
.splitbtn .tool{border-radius:10px 0 0 10px}
.caret{width:18px;border-radius:0 10px 10px 0;display:grid;place-items:center;color:var(--muted)}
.caret svg{width:13px;height:13px}
.caret:hover{background:var(--hover);color:var(--text)}
.menu{position:fixed;z-index:120;min-width:250px;background:var(--dialog);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:6px}
.menu-h{padding:6px 10px;font-size:12px;color:var(--muted)}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button.on{background:var(--accent-bg)}
.menu button span{font-size:12px;color:var(--muted)}
.swatch.none{position:relative;background:repeating-conic-gradient(#bbb 0 25%,#fff 0 50%) 0 0/10px 10px}
.swatch.none::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(135deg,transparent calc(50% - 1px),#e53935 calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px))}
.colorbox{display:flex;align-items:center;gap:8px}
.cgrid{display:flex;flex-direction:column;gap:5px}
.crow{display:flex;align-items:center;gap:5px}
.crow.rec{padding-top:5px;border-top:1px dashed var(--border)}
.swatch.ghost{background:transparent;border-style:dashed;opacity:.45}
.optbar input[type=color].bigcolor{width:46px;height:46px;border-radius:10px;border-width:1px}
.optbar input[type=color].bigcolor::-webkit-color-swatch{border-radius:9px}
.optbar input[type=color].bigcolor::-moz-color-swatch{border-radius:9px;border:0}
.hint{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--border);font-size:11px;color:var(--muted);cursor:help;flex:none}
.eyedrop{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);color:var(--text);flex:none}
.eyedrop:hover{background:var(--hover)}
.eyedrop svg{width:18px;height:18px}
.thumb.msel:not(.active) .thumb-page{outline-color:var(--accent);outline-style:dashed}
.ghead{display:flex;align-items:center;gap:4px;height:32px;margin-left:calc(var(--d,0) * 12px);padding:0 4px;border-radius:8px;background:var(--bar);border:1px solid var(--border);cursor:pointer;flex:none;position:relative;font-size:12.5px}
.ghead:hover{background:var(--hover)}
.ghead.drop-into{outline:2px solid var(--accent);outline-offset:1px}
.gtoggle{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;color:var(--muted);flex:none}
.gtoggle svg{width:14px;height:14px}
.gico{display:grid;color:var(--accent);flex:none}
.gico svg{width:15px;height:15px}
.gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.gcount{color:var(--muted);font-size:11px;padding:0 4px}
.gacts{display:none;gap:1px}
.ghead:hover .gacts{display:flex}
.ghead:hover .gcount{display:none}
.gacts button{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;color:var(--muted)}
.gacts button:hover{background:var(--hover);color:var(--text)}
.gacts svg{width:13px;height:13px}
.memo{position:absolute;z-index:6;display:flex;flex-direction:column;min-width:150px;background:#fff3a3;color:#3a3200;border:1px solid #c9ab1d;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.35);overflow:hidden;font-family:var(--font)}
.memo-head{height:26px;flex:none;display:flex;align-items:center;gap:2px;padding:0 3px 0 8px;background:#efd84f;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.memo-head:active{cursor:grabbing}
.memo-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500}
.memo-head button{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;font-size:11px;font-weight:700;color:#3a3200;flex:none}
.memo-head button:hover{background:rgba(0,0,0,.14)}
.memo-head button svg{width:14px;height:14px}
.memo-body{flex:1;min-height:0;width:100%;border:0;outline:0;resize:none;background:transparent;color:#3a3200;padding:6px 8px;font-family:var(--font);line-height:1.4}
.memo.collapsed .memo-body,.memo.collapsed .memo-resize{display:none}
.memo-resize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.4) 50% 58%,transparent 58% 70%,rgba(0,0,0,.4) 70% 78%,transparent 78%)}
.presenting .titlebar,.presenting .toolbar,.presenting .optbar,.presenting #sidebar,.presenting #layers,.presenting .zoombar,.presenting #empty,.presenting .memo{display:none!important}
.presenting .stage,.presenting .viewer{background:#000}
.presenting #pages{display:flex!important;min-height:100%;justify-content:flex-start;align-items:flex-start;padding:0}
.presenting .page{box-shadow:none!important;margin:auto}
.presenting .page-note{display:none!important}
.presenting .page:not(.pres-cur){display:none}
.presenting .textLayer{pointer-events:none!important}
.presenting .over{pointer-events:none!important}
.presenting.pres-draw .over{pointer-events:auto!important}
.presenting .text-editor{background:rgba(255,255,255,.7)}
.pb svg{width:19px;height:19px}
.pres-opts{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:8px 12px;background:rgba(30,30,30,.95);border:1px solid rgba(255,255,255,.18);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.55);white-space:nowrap;cursor:default;color:#f1f1f1;font-size:12.5px}
.pres-opts.below{bottom:auto;top:calc(100% + 10px)}
.pres-opts .swatch{width:22px;height:22px;border-color:rgba(255,255,255,.35)}
.pres-opts .swatch.on{outline-color:var(--main)}
.pres-opts input[type=range]{width:96px;accent-color:var(--main)}
.pres-opts input[type=color]{width:28px;height:28px;padding:0;border:2px solid rgba(255,255,255,.35);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.pres-opts input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.pres-opts input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.pres-opts .seg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.pres-opts .seg button{color:#f1f1f1;padding:4px 9px}
.pres-opts .seg button.on{background:var(--main);color:var(--on-main)}
.pres-opts .val{min-width:34px;font-variant-numeric:tabular-nums}
#presBar{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:4px;padding:5px 9px;background:rgba(30,30,30,.93);color:#f1f1f1;border:1px solid rgba(255,255,255,.18);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.55);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.pres-grip{display:grid;place-items:center;color:#9a9a9a;padding:0 2px}
.pb{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#f1f1f1}
.pb:hover{background:rgba(255,255,255,.14)}
.pb.on{background:var(--main);color:var(--on-main)}
#presPage{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.pb-sep{width:1px;height:22px;background:rgba(255,255,255,.22);margin:0 4px}
#laser{position:fixed;left:0;top:0;width:0;height:0;z-index:200;pointer-events:none}
#laser::before{content:'';position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0 16%,#ff2b2b 24%,rgba(255,43,43,.6) 56%,rgba(255,43,43,0) 74%);box-shadow:0 0 14px 5px rgba(255,43,43,.55)}
.laser-on .stage,.laser-on .stage *{cursor:none!important}
.zoombar{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;background:var(--bar);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:var(--shadow);z-index:20}
.zoombar .zl{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;height:30px;border-radius:999px;font-size:13px}
.zoombar .zl:hover{background:var(--hover)}

#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
.no-doc #empty{display:flex}
#empty h1{margin:0;font-size:22px;font-weight:700}
#empty p{margin:0;color:var(--muted);max-width:42ch;line-height:1.7}
#empty .fmts{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#empty .fmts span{padding:2px 10px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-size:12px}
#empty .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border-radius:999px;border:1px solid var(--border);color:var(--text)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--main);color:var(--on-main);border-color:transparent;font-weight:500}
.btn.primary:hover{filter:brightness(1.08);background:var(--main)}
.btn svg{width:18px;height:18px}
.stage.dragover::after{content:'PDF · PPTX · HWP · 이미지를 여기에 놓으세요';position:absolute;inset:14px;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:16px;background:var(--accent-bg);color:var(--accent);font-size:18px;font-weight:500;z-index:40;pointer-events:none}

/* ── 다이얼로그 / 토스트 / 로딩 ── */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:16px}
.dialog{width:min(400px,100%);background:var(--dialog);border-radius:16px;padding:22px 22px 16px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.dialog h3{margin:0 0 10px;font-size:17px;font-weight:700}
.dialog p{margin:0 0 14px;color:var(--muted);line-height:1.6}
.dialog input{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--bar2);color:var(--text);font:inherit;margin-bottom:14px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px}
.dialog .actions button{height:36px;padding:0 16px;border-radius:999px}
.dialog .actions button:hover{background:var(--hover)}
.dialog .actions .ok{background:var(--main);color:var(--on-main);font-weight:500}
.dialog .actions .ok:hover{filter:brightness(1.08);background:var(--main)}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);padding:10px 18px;border-radius:10px;background:#202124;color:#f1f3f4;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:95;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
:root[data-theme="light"] #toast{background:#323639}
#loading{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(0,0,0,.5);color:#fff}
#loading.show{display:flex}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}#toast{transition:none}}

@media (max-width:760px){
  .tool span,.tool kbd{display:none}
  .tool{min-width:44px;height:44px}
  .doc-name{max-width:28vw}
  #sidebar{position:absolute;left:0;top:0;bottom:0;box-shadow:var(--shadow)}
  #layers{position:absolute;right:0;top:0;bottom:0;box-shadow:var(--shadow)}
  .text-btn span{display:none}
  .text-btn{padding:0 8px}
  #pages{padding:14px 10px 90px}
}
/* 페이지 주석 · 목록 보기 */
.page.has-note{box-shadow:0 0 0 3px var(--main),0 6px 20px rgba(0,0,0,.35)}
.page-note{position:absolute;left:12px;top:-16px;height:16px;max-width:calc(100% - 24px);display:flex;align-items:center;gap:5px;padding:0 9px;border-radius:7px 7px 0 0;background:var(--main);color:var(--on-main);font-size:11px;font-weight:500;line-height:16px;cursor:pointer;z-index:7;white-space:nowrap}
.page-note svg{width:11px;height:11px}
.page-note .pn-text{overflow:hidden;text-overflow:ellipsis}
.thumb.has-note .thumb-page{box-shadow:0 0 0 3px var(--main),0 1px 4px rgba(0,0,0,.5)}
.thumb-flag{position:absolute;left:-7px;top:-7px;width:20px;height:20px;border-radius:50%;background:var(--main);color:var(--on-main);display:grid;place-items:center;z-index:2;box-shadow:0 1px 3px rgba(0,0,0,.45)}
.thumb-flag svg{width:12px;height:12px}
.thumb-flag[hidden]{display:none}
.thumb-name{display:none}
.side-tools{display:flex;align-items:center;gap:6px}
.mini{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;color:var(--muted)}
.mini:hover{background:var(--hover);color:var(--text)}
.mini.on{background:var(--accent-bg);color:var(--accent)}
.mini svg{width:15px;height:15px}
.list .thumbs{gap:3px;padding:6px 8px 12px}
.list .thumb{width:auto;margin-left:calc(var(--d,0) * 12px)}
.list .thumb-page,.list .thumb-num{display:none}
.list .thumb-name{display:flex;align-items:center;gap:6px;height:32px;padding:0 8px;border-radius:8px;font-size:13px;border:1px solid transparent}
.list .thumb:hover .thumb-name{background:var(--hover)}
.list .thumb.active .thumb-name{background:var(--accent-bg);color:var(--accent);font-weight:500}
.list .thumb.msel:not(.active) .thumb-name{border:1px dashed var(--accent)}
.list .thumb.has-note .thumb-name{box-shadow:inset 3px 0 0 var(--main)}
.thumb-name .tn-flag{display:grid;color:var(--main)}
.thumb-name .tn-flag svg{width:13px;height:13px}
.thumb-name .tn-flag[hidden]{display:none}
.thumb-name .tn-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .thumb-actions{top:3px;right:3px}
.list .thumb-actions button{width:24px;height:24px}
.list .thumb.drop-before::before{top:-3px}
.list .thumb.drop-after::after{bottom:-3px}
.ghead.gcur{border-color:var(--accent)}
.bright{display:flex;align-items:center;gap:6px;color:var(--muted)}
.bright svg{width:16px;height:16px}
.bright input{width:84px;accent-color:var(--main)}
.gh-link{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--muted);opacity:.6;flex:none}
.gh-link:hover{opacity:1;background:var(--hover);color:var(--text)}
.gh-link svg{width:15px;height:15px}
.layer-foot{display:flex;gap:6px;padding:8px;border-top:1px solid var(--border)}
.layer-foot button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;height:32px;border-radius:8px;border:1px solid var(--border);font-size:12px}
.layer-foot button:hover:not(:disabled){background:var(--hover)}
.layer-foot button:disabled{opacity:.4;cursor:default}
.layer-foot svg{width:15px;height:15px}
.layer.msel{background:var(--accent-bg)}
.dialog textarea{width:100%;min-height:120px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--bar2);color:var(--text);font:inherit;margin-bottom:14px;resize:vertical;line-height:1.5}
#printRoot{display:none}

/* ── 문서 탭 ── */
.tabbar{display:flex;align-items:flex-end;gap:2px;padding:6px 10px 0;background:var(--bar2);border-bottom:1px solid var(--border);flex:none;min-height:37px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.tab{display:flex;align-items:center;gap:6px;max-width:210px;min-width:96px;height:30px;padding:0 4px 0 12px;border-radius:9px 9px 0 0;color:var(--muted);border:1px solid transparent;border-bottom:0;cursor:pointer;flex:none;font-size:12.5px}
.tab:hover{background:var(--hover)}
.tab.on{background:var(--bar);color:var(--text);border-color:var(--border);height:31px;margin-bottom:-1px}
.tab-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-x{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;color:var(--muted);flex:none}
.tab-x:hover{background:var(--hover);color:var(--text)}
.tab-x svg{width:13px;height:13px}
.dirty-dot.sm{width:6px;height:6px;margin:0;flex:none}
.tab-add,.tab-open{height:26px;margin-bottom:3px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:12.5px;white-space:nowrap;flex:none}
.tab-add{width:28px;padding:0;font-size:18px;line-height:1}
.tab-add:hover,.tab-open:hover{background:var(--hover);color:var(--text)}
.no-doc .tabbar,.presenting .tabbar{display:none!important}
/* ── 레이어 / 노트 탭 ── */
.ptabs{display:flex;align-items:center;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);flex:none}
.ptab{padding:6px 9px;border-radius:8px 8px 0 0;color:var(--muted);white-space:nowrap}
.ptab:hover{background:var(--hover)}
.ptab.on{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.ptabs #layerCount{margin-left:auto;padding-right:4px;white-space:nowrap;font-size:11.5px}
#layers[data-ptab="notes"] .layer-list,#layers[data-ptab="notes"] .layer-foot,#layers[data-ptab="notes"] #layerCount{display:none}
.notes-pane{display:none;flex:1;min-height:0;flex-direction:column;gap:8px;padding:10px}
#layers[data-ptab="notes"] .notes-pane{display:flex}
.note-tabs{display:flex;flex-wrap:wrap;gap:4px;flex:none}
.nchip{min-width:28px;height:26px;padding:0 8px;border-radius:7px;border:1px solid var(--border);color:var(--muted);font-size:12px}
.nchip:hover{background:var(--hover)}
.nchip.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.nchip.add{font-size:15px;line-height:1}
.note-title,.notes-pane textarea{width:100%;border-radius:8px;border:1px solid var(--border);background:var(--bar2);color:var(--text);font:inherit;padding:7px 9px}
.note-title{flex:none}
.notes-pane textarea{flex:1;min-height:90px;resize:none;line-height:1.55}
.note-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted);flex:none}
.note-foot button{padding:4px 9px;border-radius:7px;border:1px solid var(--border);color:var(--text)}
.note-foot button:hover{background:var(--hover)}
.note-foot .stat{flex:1 1 100%}
/* ── 세로 모드 (UI를 위아래로 배치) ── */
.vmode .main{flex-direction:column}
.vmode .stage{order:1;flex:1;min-height:120px}
.vmode #sidebar,.vmode #layers{position:relative;left:auto;right:auto;top:auto;bottom:auto;box-shadow:none;width:auto;height:var(--vph,min(230px,34vh));border:0;border-top:1px solid var(--border);display:flex;order:2}
.vmode #layers{flex-direction:column}
.vmode #sidebar{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto minmax(0,1fr)}
.vmode #sidebar>.vtabs{grid-column:1/-1;grid-row:1}
.vmode #sidebar>.side-head{display:none}
.vmode #sidebar>.thumbs{grid-row:2;grid-column:1;flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:flex-start;padding:10px 12px}
.vmode #sidebar>.side-foot{grid-row:2;grid-column:2;flex-direction:column;border-top:0;border-left:1px solid var(--border);width:150px;justify-content:center}
.vmode[data-vtab="pages"] #layers,.vmode:not([data-vtab="pages"]) #sidebar,.vmode.vpanel-off #sidebar,.vmode.vpanel-off #layers{display:none}
.vmode .thumb{margin-left:0;margin-right:2px;zoom:.78}
.vmode .ghead{margin-left:0;min-width:130px;align-self:center}
.vmode .toolbar{flex-wrap:wrap;overflow-x:visible}
.vmode #listBtn{display:none}
.vmode .thumb.drop-before::before,.vmode .thumb.drop-after::after{top:0;bottom:0;width:3px;height:auto}
.vmode .thumb.drop-before::before{left:-8px;right:auto}
.vmode .thumb.drop-after::after{right:-8px;left:auto}
.vtabs{display:none!important}
.vmode .vtabs{display:flex!important}
.ptab.vonly{display:none}
.vmode .ptab.vonly{display:inline-block}
/* ── 패널 크기 조절 핸들 ── */
.rsz{position:absolute;z-index:45;touch-action:none}
#sidebar>.rsz{top:0;bottom:0;right:-4px;width:9px;cursor:col-resize}
#layers>.rsz{top:0;bottom:0;left:-4px;width:9px;cursor:col-resize}
.rsz::after{content:'';position:absolute;inset:0 3px;background:var(--accent);opacity:0;transition:opacity .12s}
.rsz:hover::after,.rsz.drag::after,.rsz:focus-visible::after{opacity:.75}
.vmode #sidebar>.rsz,.vmode #layers>.rsz{top:-4px;bottom:auto;left:0;right:0;width:auto;height:9px;cursor:row-resize}
.vmode .rsz::after{inset:3px 0}
body.rszing,body.rszing *{user-select:none!important}
/* ── 멀티작업 패널 ── */
.work-pane{display:none;flex:1;min-height:0;flex-direction:column}
#layers[data-ptab="work"] .work-pane{display:flex}
#layers[data-ptab="work"] .layer-list,#layers[data-ptab="work"] .layer-foot,#layers[data-ptab="work"] #layerCount{display:none}
.wtabs{display:flex;align-items:flex-end;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;flex:none}
.wtabs:empty{display:none}
.wtab{display:flex;align-items:center;gap:4px;max-width:150px;min-width:70px;height:26px;padding:0 3px 0 9px;border-radius:7px 7px 0 0;border:1px solid transparent;border-bottom:0;color:var(--muted);font-size:12px;cursor:pointer;flex:none}
.wtab:hover{background:var(--hover)}
.wtab.on{background:var(--view);color:var(--text);border-color:var(--border);margin-bottom:-1px;height:27px}
.wtab .wn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wtab .wx{display:grid;place-items:center;width:18px;height:18px;border-radius:5px;flex:none}
.wtab .wx:hover{background:var(--hover)}
.wtab .wx svg{width:12px;height:12px}
.wtabs .wadd{width:24px;height:24px;margin-bottom:2px;border-radius:7px;color:var(--muted);font-size:16px;line-height:1;flex:none}
.wtabs .wadd:hover{background:var(--hover);color:var(--text)}
.wbody{flex:1;min-height:0;position:relative;overflow:auto;background:var(--view);scrollbar-width:thin}
.wbody.dragover{outline:2px dashed var(--accent);outline-offset:-4px}
.wempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.65}
.wopen{width:76px;height:76px;border-radius:50%;border:2px dashed var(--accent);color:var(--accent);display:grid;place-items:center}
.wopen:hover{background:var(--accent-bg)}
.wopen svg{width:32px;height:32px}
.wpdf{padding:8px;display:flex;flex-direction:column;gap:8px;align-items:center}
.wpg{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);flex:none}
.wpg canvas{display:block}
.wact{position:sticky;top:0;z-index:2;display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px;background:var(--bar2);border-bottom:1px solid var(--border)}
.wact button{padding:3px 10px;border-radius:7px;border:1px solid var(--border);color:var(--text);font-size:12px}
.wact button:hover{background:var(--hover)}
.searchp{position:absolute;top:10px;right:18px;z-index:40;width:min(400px,calc(100% - 36px));display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--dialog);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.searchp[hidden]{display:none}
.sp-row{display:flex;gap:4px;align-items:center}
.sbox{display:flex;align-items:center;height:30px;margin-left:8px;border:1px solid var(--border);border-radius:8px;background:var(--bar2);flex:0 1 190px;min-width:90px}
.sbox:focus-within{outline:2px solid var(--accent);outline-offset:-1px}
.sbox input{flex:1;min-width:0;width:100%;height:100%;padding:0 4px 0 9px;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:13px}
.sbox input::-webkit-search-cancel-button{-webkit-appearance:none}
.sbox button{display:grid;place-items:center;width:30px;height:100%;color:var(--muted);flex:none;border-radius:0 7px 7px 0}
.sbox button:hover{background:var(--accent);color:#000}
.sbox svg{width:16px;height:16px}
#newBtn,#openBtn{white-space:nowrap}
@media(max-width:900px){.sbox{flex-basis:110px;min-width:70px}}
.sp-row button{display:grid;place-items:center;min-width:28px;height:28px;border-radius:7px;color:var(--text);font-size:12px}
.sp-row button:hover{background:var(--hover)}
#spCount{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sp-opt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.sp-opt label{display:flex;gap:4px;align-items:center;cursor:pointer}
.sp-list{max-height:min(46vh,340px);overflow:auto;display:flex;flex-direction:column;gap:1px;scrollbar-width:thin}
.sp-item{display:block;width:100%;text-align:left;padding:5px 8px;border-radius:7px;font-size:12.5px;line-height:1.4;color:var(--text)}
.sp-item:hover{background:var(--hover)}
.sp-item.on{background:var(--accent-bg)}
.sp-item i{font-style:normal;display:inline-block;min-width:34px;margin-right:6px;font-size:11px;color:var(--accent);font-weight:600}
.sp-item mark{background:var(--accent);color:#000;border-radius:2px;padding:0 1px}
.shl{position:absolute;background:rgba(219,190,67,.42);mix-blend-mode:multiply;pointer-events:none;border-radius:2px;z-index:3}
.shl.cur{background:rgba(255,140,0,.55);outline:2px solid #ff8c00}
.thumb.bm .thumb-page::after{content:'';position:absolute;right:5px;top:-3px;width:13px;height:19px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%);z-index:2}
.thumb.bm .thumb-actions .bm{color:var(--accent)}
.thumb.bm .tn-text::before{content:'★ ';color:var(--accent)}
.fontbtn{display:flex;align-items:center;gap:6px;height:30px;max-width:170px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--bar);color:var(--text);font-size:13px;white-space:nowrap}
.fontbtn span{overflow:hidden;text-overflow:ellipsis}
.fontbtn:hover{background:var(--hover)}
.fontmenu{min-width:280px;max-height:min(70vh,420px);overflow:auto}
.fontmenu button{flex-direction:row;align-items:baseline;justify-content:space-between;gap:14px}
.fontmenu button b{font-weight:500;font-size:16px}
.fontmenu button span{font-size:11.5px;color:var(--muted);font-family:var(--ui,inherit)}
.bmmenu{min-width:230px;max-width:min(320px,90vw);max-height:min(70vh,420px);overflow:auto}
.bmmenu button.cur{border-top:1px solid var(--border);border-radius:0 0 8px 8px;margin-top:4px;color:var(--accent)}
.wbody.webmode{overflow:hidden;display:flex;flex-direction:column}
.wurl{display:flex;gap:4px;align-items:center;padding:6px;background:var(--bar2);border-bottom:1px solid var(--border);flex:none}

function modal({ title, message, input, multiline, ok = '확인', cancel = '취소' }) {
  return new Promise(resolve => {
    const m = $('#modal'), body = $('#mBody'), acts = $('#mActions');
    $('#mTitle').textContent = title;
    body.innerHTML = '';
    if (message) { const p = document.createElement('p'); p.textContent = message; body.appendChild(p); }
    let inp = null;
    if (input !== undefined) {
      inp = document.createElement(multiline ? 'textarea' : 'input');
      if (!multiline) inp.type = 'text';
      inp.value = input; body.appendChild(inp);
    }
    acts.innerHTML = '';
    const bc = document.createElement('button'); bc.textContent = cancel;
    const bo = document.createElement('button'); bo.textContent = ok; bo.className = 'ok';
    acts.append(bc, bo);
    const done = v => { m.hidden = true; m.removeEventListener('keydown', onKey); resolve(v); };
    const accept = () => done(inp ? inp.value : true);
    const reject = () => done(inp ? null : false);
    const onKey = e => {
      if (e.key === 'Escape') { e.preventDefault(); reject(); }
      else if (e.key === 'Enter' && (!multiline || e.ctrlKey || e.metaKey)) { e.preventDefault(); accept(); }
    };
    bc.onclick = reject; bo.onclick = accept;
    m.addEventListener('keydown', onKey);
    m.hidden = false;
    (inp || bo).focus();
    if (inp) inp.select();
  });
}
