<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meow-PDF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23dbbe43' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 5c.67 0 1.35.09 2 .26 1.78-2 5.03-2.84 6.42-2.26 1.4.58-.42 7-.42 7 .57 1.07 1 2.24 1 3.44C21 17.9 16.97 21 12 21s-9-3-9-7.56c0-1.25.5-2.4 1-3.44 0 0-1.89-6.42-.5-7 1.39-.58 4.72.23 6.5 2.23A9.04 9.04 0 0 1 12 5Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&family=Nanum+Gothic+Coding:wght@400;700&display=swap" rel="stylesheet">
<style>
:root, :root[data-theme="dark"]{
  color-scheme: dark;
  --font: "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",system-ui,sans-serif;
  --view:#232323;
  --bar:#2e2e2e;
  --bar2:#272727;
  --side:#272727;
  --text:#ececec;
  --muted:#9a9a9a;
  --border:#434343;
  --hover:rgba(255,255,255,.08);
  --accent:#dbbe43;
  --accent-bg:rgba(219,190,67,.2);
  --on-accent:#2a2200;
  --main:#dbbe43;
  --on-main:#2a2200;
  --danger:#f28b82;
  --dialog:#383838;
  --shadow:0 2px 10px rgba(0,0,0,.45);
}
:root[data-theme="light"]{
  color-scheme: light;
  --view:#e6e6e6;
  --bar:#ffffff;
  --bar2:#f4f4f4;
  --side:#f4f4f4;
  --text:#222222;
  --muted:#666666;
  --border:#d6d6d6;
  --hover:rgba(0,0,0,.07);
  --accent:#8a7410;
  --accent-bg:rgba(219,190,67,.3);
  --on-accent:#ffffff;
  --main:#dbbe43;
  --on-main:#2a2200;
  --danger:#d93025;
  --dialog:#ffffff;
  --shadow:0 2px 10px rgba(0,0,0,.18);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--view);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;flex:none;display:block}
[hidden]{display:none!important}

#app{display:flex;flex-direction:column;height:100%}

/* ── 상단 타이틀 바 ── */
.titlebar{display:flex;align-items:center;gap:10px;height:44px;padding:0 10px;background:var(--bar);border-bottom:1px solid var(--border);flex:none}
.icon-btn{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:var(--text)}
.icon-btn:hover{background:var(--hover)}
.icon-btn.on{background:var(--accent-bg);color:var(--accent)}
.doc-name{font-weight:500;max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px;margin:0 -8px;border-radius:7px;border:1px solid transparent}
.doc-name.editable{cursor:text}
.doc-name.editable:hover{background:var(--hover)}
.doc-name:has(input){overflow:visible;background:var(--bar2);border-color:var(--accent)}
.dn-input{font:inherit;color:inherit;background:transparent;border:0;outline:0;padding:0;margin:0;min-width:8ch;max-width:34vw}
.dn-ext{color:var(--muted);font-weight:400}
.dirty-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.pager{display:flex;align-items:center;gap:6px;color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
.pager input{width:46px;height:28px;text-align:center;background:var(--bar2);color:var(--text);border:1px solid var(--border);border-radius:6px;font:inherit;-moz-appearance:textfield}
.pager input::-webkit-outer-spin-button,.pager input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.spacer{flex:1}
.text-btn{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;color:var(--text)}
.text-btn:hover{background:var(--hover)}
.text-btn svg{width:18px;height:18px}

/* ── 도구 모음 ── */
.toolbar{display:flex;align-items:center;gap:2px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--border);overflow-x:auto;flex:none;scrollbar-width:thin}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:54px;height:52px;padding:0 8px;border-radius:10px;font-size:11px;white-space:nowrap;color:var(--text);flex:none}
.tool svg{width:20px;height:20px}
.tool:hover{background:var(--hover)}
.tool.active{background:var(--accent-bg);color:var(--accent)}
.tool:disabled{opacity:.35;pointer-events:none}
.tool.primary{background:var(--main);color:var(--on-main);font-weight:500}
.tool.primary:hover{filter:brightness(1.08)}
.sep{width:1px;height:30px;background:var(--border);margin:0 6px;flex:none}
.no-doc .needs-doc{opacity:.38;pointer-events:none}

/* ── 옵션 바 ── */
.optbar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;min-height:44px;padding:5px 12px;background:var(--bar2);border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);flex:none}
.optbar .grp{display:flex;align-items:center;gap:6px}
.optbar label{color:var(--muted)}
.optbar .val{min-width:28px;color:var(--text);font-variant-numeric:tabular-nums}
.swatch{width:18px;height:18px;border-radius:50%;background:var(--c);border:2px solid var(--border);flex:none}
.swatch.on{outline:2px solid var(--accent);outline-offset:2px}
.optbar input[type=color]{width:26px;height:26px;padding:0;border:2px solid var(--border);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.optbar input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.optbar input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.optbar input[type=range]{width:84px;accent-color:var(--accent)}
.optbar .val{min-width:34px;text-align:right}
.optbar .rg{gap:5px}
.seg{display:flex;gap:2px;padding:2px;background:var(--bar);border:1px solid var(--border);border-radius:10px}
.seg button{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:8px;color:var(--text);font-size:12.5px}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--accent-bg);color:var(--accent)}
.chip{padding:3px 10px;border-radius:999px;background:var(--accent-bg);color:var(--accent)}
.danger-btn{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;color:var(--danger);border:1px solid var(--border)}
.danger-btn:hover{background:var(--hover)}
.danger-btn svg{width:16px;height:16px}

/* ── 본문 ── */
.main{flex:1;display:flex;min-height:0;position:relative}
#sidebar{position:relative;width:var(--sbw,200px);flex:none;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--border);z-index:30}
.sidebar-off #sidebar{display:none}
.side-head{padding:12px 14px 6px;font-weight:500;display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
.thumbs{flex:1;overflow-y:auto;padding:8px 12px 16px;display:flex;flex-direction:column;align-items:stretch;gap:12px;scrollbar-width:thin}
.thumb{position:relative;width:var(--tw,128px);margin-left:calc(var(--d,0) * 12px + 8px);cursor:pointer;flex:none}
.thumb-page{position:relative;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5);outline:2px solid transparent;outline-offset:2px;border-radius:2px}
.thumb.active .thumb-page{outline-color:var(--accent)}
.thumb:hover .thumb-page{outline-color:var(--border)}
.thumb.active:hover .thumb-page{outline-color:var(--accent)}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.thumb-num{text-align:center;font-size:12px;color:var(--muted);margin-top:7px}
.thumb.active .thumb-num{color:var(--accent);font-weight:500}
.thumb-actions{position:absolute;top:5px;right:5px;z-index:3;display:flex;flex-direction:column;gap:1px;width:24px;height:24px;overflow:hidden;border-radius:9px;background:rgba(24,24,26,.8);box-shadow:0 1px 4px rgba(0,0,0,.4);opacity:0;transition:opacity .12s}
.thumb-actions::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 6px 12px,#fff 1.6px,transparent 2.1px),radial-gradient(circle at 12px 12px,#fff 1.6px,transparent 2.1px),radial-gradient(circle at 18px 12px,#fff 1.6px,transparent 2.1px)}
.thumb:hover .thumb-actions,.thumb:focus-within .thumb-actions{opacity:1}
.thumb-actions:hover,.thumb-actions:focus-within{height:auto;overflow:visible;padding:2px 0}
.thumb-actions:hover::before,.thumb-actions:focus-within::before{display:none}
.thumb-actions button{display:none;place-items:center;width:24px;height:24px;border-radius:7px;background:transparent;color:#fff}
.thumb-actions:hover button,.thumb-actions:focus-within button{display:grid}
.thumb-actions button:hover{background:var(--main);color:var(--on-main)}
.thumb-actions button.del:hover{background:var(--danger);color:#fff}
.thumb-actions svg{width:14px;height:14px}
@media (hover:none){.thumb-actions{opacity:1;height:auto;overflow:visible;padding:2px 0}.thumb-actions::before{display:none}.thumb-actions button{display:grid}}
.thumb.dragging{opacity:.4}
.thumb.drop-before::before,.thumb.drop-after::after{content:'';position:absolute;left:-4px;right:-4px;height:3px;border-radius:2px;background:var(--accent)}
.thumb.drop-before::before{top:-9px}
.thumb.drop-after::after{bottom:-9px}
.side-foot{padding:6px 8px 8px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:4px}
.side-foot button{min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 6px;border-radius:7px;border:0;background:transparent;color:var(--muted);font-size:12px;white-space:nowrap}
.side-foot button:hover{background:var(--hover);color:var(--text)}
.side-foot #manageBtn{grid-column:1/-1;background:var(--hover);color:var(--text)}
.side-foot #manageBtn:hover{background:var(--accent-bg);color:var(--accent)}
.side-foot svg{width:14px;height:14px;flex:none}

.stage{position:relative;flex:1;min-width:0;overflow:hidden}
.viewer{position:absolute;inset:0;overflow:auto;scrollbar-width:thin;background:var(--view)}
#pages{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 24px 90px;min-width:min-content}
.page{position:relative;flex:none;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.45),0 6px 20px rgba(0,0,0,.3)}
.page canvas{position:absolute;inset:0;width:100%;height:100%}
.page .over{touch-action:pan-y}
.page .hlc{pointer-events:none;mix-blend-mode:multiply}
.tool-pen .page .over,.tool-line .page .over,.tool-highlight .page .over,.tool-shape .page .over,.tool-eraser .page .over{touch-action:none}
.tool-shape .over{cursor:crosshair}
.tool-pen .over,.tool-line .over,.tool-highlight .over{cursor:var(--brush-cursor,crosshair)}
.tool-text .over{cursor:text}
.tool-eraser .over{cursor:var(--eraser-cursor,crosshair)}
.te-handle{position:absolute;z-index:6;width:20px;height:20px;margin:-13px 0 0 -13px;border-radius:50%;background:#dbbe43;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;cursor:grab;touch-action:none;color:#1b1b1b}
.te-handle:active{cursor:grabbing}
.te-handle svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.text-editor{position:absolute;margin:0;padding:0;border:0;outline:1.5px dashed var(--accent);outline-offset:2px;background:rgba(255,255,255,.55);resize:none;overflow:hidden;white-space:pre;font-family:var(--font);line-height:1.25;z-index:5;min-width:20px}

.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;transform-origin:0 0;pointer-events:none;-webkit-user-select:none;user-select:none}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;transform-origin:0 0}
.textLayer ::selection{background:rgba(219,190,67,.45)}
.tool-select .textLayer{pointer-events:auto;-webkit-user-select:text;user-select:text}
.tool-select .textLayer span{cursor:text}
.tool-select .page .over{pointer-events:none}
.spread-on #pages{display:grid;grid-template-columns:repeat(2,max-content);justify-content:center;align-items:center;gap:16px}
.opt-btn{display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;border:1px solid var(--border);color:var(--text)}
.opt-btn:hover{background:var(--hover)}
.zsep{width:1px;height:20px;background:var(--border);margin:0 4px}
.zoombar .icon-btn{width:32px;height:32px}
#layers{position:relative;width:var(--lyw,232px);flex:none;display:flex;flex-direction:column;background:var(--side);border-left:1px solid var(--border);z-index:30}
.layers-off #layers{display:none}
.layer-list{flex:1;overflow-y:auto;padding:6px 8px 12px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin}
.layer{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 4px 0 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;flex:none}
.layer:hover{background:var(--hover)}
.layer.sel{background:var(--accent-bg);border-color:var(--accent)}
.layer .l-ico{color:var(--muted);display:grid}
.layer .l-ico svg{width:17px;height:17px}
.layer .l-dot{width:11px;height:11px;border-radius:50%;background:var(--c);border:1px solid var(--border);flex:none}
.layer .l-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.layer.off .l-name,.layer.off .l-ico,.layer.off .l-dot{opacity:.4}
.l-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;color:var(--muted);flex:none}
.l-btn:hover{background:var(--hover);color:var(--text)}
.l-btn svg{width:16px;height:16px}
.layer.dragging{opacity:.4}
.layer.drop-before::before,.layer.drop-after::after{content:'';position:absolute;left:4px;right:4px;height:3px;border-radius:2px;background:var(--accent)}
.layer.drop-before::before{top:-3px}
.layer.drop-after::after{bottom:-3px}
.layer-empty{padding:18px 14px;color:var(--muted);font-size:12.5px;line-height:1.7}
.tool{position:relative}
.tool kbd{position:absolute;top:3px;right:5px;font:inherit;font-size:9.5px;line-height:1;color:var(--muted);text-transform:uppercase;pointer-events:none}
.tool.active kbd{color:var(--accent)}
.tool.primary kbd{color:inherit}
.brand{display:grid;place-items:center;width:34px;height:34px;color:var(--accent);margin-right:14px;flex:none}
.brand svg{width:27px;height:27px}
.optbar select{height:30px;max-width:170px;padding:0 8px;border-radius:8px;border:1px solid var(--border);background:var(--bar);color:var(--text);font:inherit}
.fmt{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);color:var(--text);font-size:14px;line-height:1}
.fmt:hover{background:var(--hover)}
.fmt.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.clock{font-variant-numeric:tabular-nums;color:var(--text);padding:0 10px;font-size:13.5px;letter-spacing:.02em;white-space:nowrap}
.splitbtn{display:flex;align-items:stretch;flex:none}
.splitbtn .tool{border-radius:10px 0 0 10px}
.caret{width:18px;border-radius:0 10px 10px 0;display:grid;place-items:center;color:var(--muted)}
.caret svg{width:13px;height:13px}
.caret:hover{background:var(--hover);color:var(--text)}
.menu{position:fixed;z-index:120;min-width:250px;background:var(--dialog);border:1px solid var(--border);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);padding:6px}
.menu-h{padding:6px 10px;font-size:12px;color:var(--muted)}
.menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.menu button:hover{background:var(--hover)}
.menu button.on{background:var(--accent-bg)}
.menu button span{font-size:12px;color:var(--muted)}
.swatch.none{position:relative;background:repeating-conic-gradient(#bbb 0 25%,#fff 0 50%) 0 0/10px 10px}
.swatch.none::after{content:'';position:absolute;inset:-2px;border-radius:50%;background:linear-gradient(135deg,transparent calc(50% - 1px),#e53935 calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px))}
.colorbox{display:flex;align-items:center;gap:8px}
.cgrid{display:flex;flex-direction:column;gap:5px}
.crow{display:flex;align-items:center;gap:5px}
.crow.rec{padding-top:5px;border-top:1px dashed var(--border)}
.swatch.ghost{background:transparent;border-style:dashed;opacity:.45}
.optbar input[type=color].bigcolor{width:46px;height:46px;border-radius:10px;border-width:1px}
.optbar input[type=color].bigcolor::-webkit-color-swatch{border-radius:9px}
.optbar input[type=color].bigcolor::-moz-color-swatch{border-radius:9px;border:0}
.hint{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--border);font-size:11px;color:var(--muted);cursor:help;flex:none}
.eyedrop{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);color:var(--text);flex:none}
.eyedrop:hover{background:var(--hover)}
.eyedrop svg{width:18px;height:18px}
.thumb.msel:not(.active) .thumb-page{outline-color:var(--accent);outline-style:dashed}
.ghead{display:flex;align-items:center;gap:4px;height:32px;margin-left:calc(var(--d,0) * 12px);padding:0 4px;border-radius:8px;background:var(--bar);border:1px solid var(--border);cursor:pointer;flex:none;position:relative;font-size:12.5px}
.ghead:hover{background:var(--hover)}
.ghead.drop-into{outline:2px solid var(--accent);outline-offset:1px}
.gtoggle{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;color:var(--muted);flex:none}
.gtoggle svg{width:14px;height:14px}
.gico{display:grid;color:var(--accent);flex:none}
.gico svg{width:15px;height:15px}
.gname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.gcount{color:var(--muted);font-size:11px;padding:0 4px}
.gacts{display:none;gap:1px}
.ghead:hover .gacts{display:flex}
.ghead:hover .gcount{display:none}
.gacts button{display:grid;place-items:center;width:20px;height:20px;border-radius:5px;color:var(--muted)}
.gacts button:hover{background:var(--hover);color:var(--text)}
.gacts svg{width:13px;height:13px}
.memo{position:absolute;z-index:6;display:flex;flex-direction:column;min-width:150px;background:#fff3a3;color:#3a3200;border:1px solid #c9ab1d;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.35);overflow:hidden;font-family:var(--font)}
.memo-head{height:26px;flex:none;display:flex;align-items:center;gap:2px;padding:0 3px 0 8px;background:#efd84f;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.memo-head:active{cursor:grabbing}
.memo-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:500}
.memo-head button{display:grid;place-items:center;width:22px;height:22px;border-radius:5px;font-size:11px;font-weight:700;color:#3a3200;flex:none}
.memo-head button:hover{background:rgba(0,0,0,.14)}
.memo-head button svg{width:14px;height:14px}
.memo-body{flex:1;min-height:0;width:100%;border:0;outline:0;resize:none;background:transparent;color:#3a3200;padding:6px 8px;font-family:var(--font);line-height:1.4}
.memo.collapsed .memo-body,.memo.collapsed .memo-resize{display:none}
.memo-resize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.4) 50% 58%,transparent 58% 70%,rgba(0,0,0,.4) 70% 78%,transparent 78%)}
.presenting .titlebar,.presenting .toolbar,.presenting .optbar,.presenting #sidebar,.presenting #layers,.presenting .zoombar,.presenting #empty,.presenting .memo{display:none!important}
.presenting .stage,.presenting .viewer{background:#000}
.presenting #pages{display:flex!important;min-height:100%;justify-content:flex-start;align-items:flex-start;padding:0}
.presenting .page{box-shadow:none!important;margin:auto}
.presenting .page-note{display:none!important}
.presenting .page:not(.pres-cur){display:none}
.presenting .textLayer{pointer-events:none!important}
.presenting .over{pointer-events:none!important}

#presBar{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:4px;padding:5px 9px;background:rgba(30,30,30,.93);color:#f1f1f1;border:1px solid rgba(255,255,255,.18);border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.55);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}

.pb{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;color:#f1f1f1}
.pb:hover{background:rgba(255,255,255,.14)}
.pb.on{background:var(--main);color:var(--on-main)}
#presPage{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;font-size:13px}

#laser::before{content:'';position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff 0 16%,#ff2b2b 24%,rgba(255,43,43,.6) 56%,rgba(255,43,43,0) 74%);box-shadow:0 0 14px 5px rgba(255,43,43,.55)}
.laser-on .stage,.laser-on .stage *{cursor:none!important}
.zoombar{position:absolute;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:2px;background:var(--bar);border:1px solid var(--border);border-radius:999px;padding:4px;box-shadow:var(--shadow);z-index:20}

#empty{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}

.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border-radius:999px;border:1px solid var(--border);color:var(--text)}

.stage.dragover::after{content:'PDF · PPTX · HWP · 이미지를 여기에 놓으세요';position:absolute;inset:14px;display:grid;place-items:center;border:2px dashed var(--accent);border-radius:16px;background:var(--accent-bg);color:var(--accent);font-size:18px;font-weight:500;z-index:40;pointer-events:none}

/* ── 다이얼로그 / 토스트 / 로딩 ── */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.5);padding:16px}
.dialog{width:min(400px,100%);background:var(--dialog);border-radius:16px;padding:22px 22px 16px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.dialog h3{margin:0 0 10px;font-size:17px;font-weight:700}
.dialog p{margin:0 0 14px;color:var(--muted);line-height:1.6}
.dialog input{width:100%;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--bar2);color:var(--text);font:inherit;margin-bottom:14px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px}
.dialog .actions button{height:36px;padding:0 16px;border-radius:999px}
.dialog .actions button:hover{background:var(--hover)}
.dialog .actions .ok{background:var(--main);color:var(--on-main);font-weight:500}
.dialog .actions .ok:hover{filter:brightness(1.08);background:var(--main)}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);padding:10px 18px;border-radius:10px;background:#202124;color:#f1f3f4;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:95;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
:root[data-theme="light"] #toast,:root[data-theme="aero"] #toast{background:#323639}
/* 프루티거 에어로 테마 */
:root[data-theme="aero"]{
  color-scheme: light;
  --view:#cfeaf8;--bar:#f4fbff;--bar2:#e4f4fc;--side:#e8f6fd;--text:#0f3550;--muted:#4a7690;--border:#9fd0ea;--hover:rgba(24,150,220,.13);
  --accent:#0b86c9;--accent-bg:rgba(37,170,236,.22);--on-accent:#ffffff;--main:#4fbf3f;--on-main:#ffffff;--danger:#d93025;--dialog:#f7fcff;
  --shadow:0 4px 16px rgba(20,110,170,.25);
}
:root[data-theme="aero"] body{background:linear-gradient(160deg,#a9dcf6 0%,#e6f7ff 48%,#bff0c8 100%)}
:root[data-theme="aero"] .viewer{background:radial-gradient(ellipse at 15% 0%,#f0fbff 0,transparent 55%),radial-gradient(ellipse at 95% 100%,#c8f3cf 0,transparent 55%),linear-gradient(160deg,#a9dcf6,#d6f0fb 50%,#b9ecc4)}
:root[data-theme="aero"] .titlebar,:root[data-theme="aero"] .toolbar{background:linear-gradient(180deg,#ffffff 0%,#e1f3fc 50%,#cbe9f8 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 1px 6px rgba(20,120,180,.18)}
:root[data-theme="aero"] .optbar,:root[data-theme="aero"] .tabbar{background:linear-gradient(180deg,#f4fcff,#daeffa)}
:root[data-theme="aero"] #sidebar,:root[data-theme="aero"] #layers{background:linear-gradient(180deg,#f0fbff,#d6edf9)}
:root[data-theme="aero"] .tool:hover{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(160,215,245,.55));box-shadow:inset 0 1px 0 #fff}
:root[data-theme="aero"] .tool.active{background:linear-gradient(180deg,#9be0ff 0%,#3fb8ef 50%,#1c9ad8 51%,#55c8f5 100%);color:#fff;text-shadow:0 1px 1px rgba(0,60,100,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 2px 6px rgba(20,130,200,.4)}
:root[data-theme="aero"] .tool.active kbd{color:#e8f8ff}
:root[data-theme="aero"] .tool.primary,:root[data-theme="aero"] .btn.primary,:root[data-theme="aero"] .dialog .actions .ok{background:linear-gradient(180deg,#b4f48c 0%,#58c63e 50%,#3aa92a 51%,#80de5a 100%);color:#fff;text-shadow:0 1px 1px rgba(0,80,0,.45);border:1px solid #3d9a2b;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 5px rgba(40,140,40,.35)}
:root[data-theme="aero"] .page{box-shadow:0 6px 22px rgba(20,100,160,.3),0 0 0 1px rgba(255,255,255,.7)}
:root[data-theme="aero"] .setdlg,:root[data-theme="aero"] .dialog{box-shadow:0 18px 50px rgba(15,90,140,.35),inset 0 1px 0 #fff}
.segs button.aeroopt{margin-left:14px;background:linear-gradient(135deg,#9be3ff,#6fd05f);color:#06304a;font-weight:600;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.segs button.aeroopt.on{outline:2px solid var(--accent);outline-offset:1px}
#loading{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(0,0,0,.5);color:#fff}
#loading.show{display:flex}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}#toast{transition:none}}

@media (max-width:760px){
  .tool span,.tool kbd{display:none}
  .tool{min-width:44px;height:44px}
  .doc-name{max-width:28vw}
  #sidebar{position:absolute;left:0;top:0;bottom:0;box-shadow:var(--shadow)}
  #layers{position:absolute;right:0;top:0;bottom:0;box-shadow:var(--shadow)}
  .text-btn span{display:none}
  .text-btn{padding:0 8px}
  #pages{padding:14px 10px 90px}
}

@media (max-width:760px){.bright input{width:56px}}
@media print{
  html{filter:none!important}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  #printRoot .pp{display:block;break-after:page;page-break-after:always}
  #printRoot .pp:last-child{break-after:auto;page-break-after:auto}
}

#empty{gap:20px}
#empty .row{margin-top:0}
#empty .ehint{font-size:12.5px;color:var(--muted);white-space:nowrap}
em.pro,.menu b em.pro{font-style:normal;font-size:10.5px;margin-left:8px;padding:1px 7px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-weight:600;vertical-align:1px}
.menu-sep{height:1px;background:var(--border);margin:6px 4px}
.menu .menu-note{font-size:11.5px;line-height:1.5;padding-top:2px}
.mlist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;max-height:48vh;overflow:auto;padding:4px 2px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border);border-radius:10px;background:var(--bar2);cursor:grab;position:relative}
.mrow.cur{border-color:var(--accent)}
.mrow.dragging{opacity:.45}
.mrow.ins-b::before,.mrow.ins-a::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--accent);border-radius:2px}
.mrow.ins-b::before{top:-6px}.mrow.ins-a::after{bottom:-6px}
.mgrip svg{width:16px;height:16px;color:var(--muted);display:block}
.mno{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:12px;font-weight:700;flex:none}
.mname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub{font-size:12px;color:var(--muted);flex:none}
.mbtns{display:flex;flex:none}.mbtns button{width:26px;height:26px;border-radius:6px;font-size:11px;color:var(--text)}
.mbtns button:hover:not(:disabled){background:var(--hover)}.mbtns button:disabled{opacity:.3}
.dropnames{white-space:pre-line;padding:10px 12px;border-radius:10px;background:var(--bar2);border:1px solid var(--border);margin-bottom:12px;font-size:13.5px;word-break:break-all}
.complist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.compopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer}
.compopt:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
.dialog .compopt input{width:auto;height:auto;margin:3px 0 0;padding:0}
.compopt span{display:flex;flex-direction:column}.compopt em{font-style:normal;color:var(--muted);font-size:12.5px}
.compnote{font-size:12.5px}
.keyout{display:flex;gap:8px;align-items:center;margin-top:10px}
.keyout code{flex:1;min-width:0;padding:9px 10px;border-radius:8px;background:var(--bar2);border:1px solid var(--accent);color:var(--accent);font-size:13px;letter-spacing:1px;user-select:all;overflow-wrap:anywhere}
.keyout .b{width:auto;padding:0 14px;flex:none;margin:0}
.keynote{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
.keytbl{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:240px;overflow:auto}
.keyrow{display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;padding:7px 9px;border-radius:8px;background:var(--bar2);font-size:12.5px}
.keyrow.off{opacity:.55}.keyrow .kh{font-family:ui-monospace,Consolas,monospace;color:var(--accent);letter-spacing:.5px;user-select:all;word-break:break-all}
.keyrow .kb{display:flex;gap:10px}.keyrow .kd{grid-column:1/3;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keyrow .lnk.bad{color:var(--danger)}
#pgmgr{position:fixed;inset:0;z-index:80;background:var(--view);display:flex;flex-direction:column}
#pgmgr[hidden]{display:none}
body.pm-open{overflow:hidden}
.pm-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--bar);border-bottom:1px solid var(--border)}
.pm-title{font-size:16px;margin-right:6px}.pm-count{color:var(--muted);font-size:13px}.pm-sp{flex:1}
.pm-bar button{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--border);color:var(--text)}
.pm-bar button:hover:not(:disabled){background:var(--hover)}.pm-bar button:disabled{opacity:.4;cursor:default}
.pm-bar .ok{background:var(--main);color:var(--on-main);border-color:var(--main);font-weight:600}
.pm-bar .danger{color:var(--danger)}
.pm-size{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:10px}.pm-size input{width:140px}
.pm-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--pw,200px),1fr));gap:20px 16px;padding:16px 20px;align-content:start;outline:0}
.pm-gh{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:6px 10px;margin-left:calc(var(--d,0)*18px);border-left:3px solid var(--accent);background:var(--bar2);border-radius:8px;font-weight:600;min-width:0}
.pm-gh.none{border-left-color:var(--border);color:var(--muted);background:transparent;font-weight:400;font-size:12.5px}
.pm-gh.drop-h{outline:2px dashed var(--accent)}
.pm-gico svg{width:16px;height:16px;color:var(--accent);display:block}
.pm-gpath{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-gacts{display:flex;gap:2px}.pm-gacts button{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--text)}
.pm-gacts button:hover{background:var(--hover)}.pm-gacts svg{width:15px;height:15px}
.pm-card{position:relative;cursor:grab;display:flex;flex-direction:column;gap:6px;min-width:0}
.pm-card.ins-l::before,.pm-card.ins-r::after{content:'';position:absolute;top:0;bottom:24px;width:4px;border-radius:2px;background:var(--accent);z-index:2}
.pm-card.ins-l::before{left:-10px}.pm-card.ins-r::after{right:-10px}
.pm-card.dragging{opacity:.4}
.pm-thumb{position:relative;width:100%;background:#fff;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.5);outline:2px solid transparent;outline-offset:2px;overflow:hidden}
.pm-thumb canvas{display:block;width:100%;height:100%}
.pm-card:hover .pm-thumb{outline-color:var(--border)}
.pm-card.sel .pm-thumb,.pm-card.sel:hover .pm-thumb{outline-color:var(--accent)}
.pm-no{position:absolute;left:6px;top:6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;display:grid;place-items:center}
.pm-chk{position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.35);box-shadow:0 0 2px #000}
.pm-card.sel .pm-chk{background:var(--accent);border-color:var(--accent)}
.pm-card.sel .pm-chk::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.pm-x{position:absolute;right:6px;bottom:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:none;place-items:center}
.pm-card:hover .pm-x{display:grid}.pm-x svg{width:14px;height:14px}
.pm-bm{position:absolute;right:32px;top:0;width:14px;height:20px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%)}
.pm-name{text-align:center;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pm-name.empty{color:var(--muted);opacity:.6}
.pm-hint{padding:8px 16px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);background:var(--bar)}
.pm-ghost{position:fixed;left:-300px;top:0;padding:6px 12px;background:var(--accent);color:var(--on-accent);border-radius:8px;font-weight:700}

/* ════════════ 설정 창 ════════════ */
.setw{position:fixed;inset:0;z-index:85;display:grid;place-items:center;background:rgba(0,0,0,.52);padding:16px}
.setdlg{display:grid;grid-template-columns:224px minmax(0,1fr);width:min(1000px,100%);height:min(700px,100%);background:var(--dialog);border:1px solid var(--border);border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.55);overflow:hidden}
.setnav{display:flex;flex-direction:column;gap:10px;padding:14px 10px;background:var(--bar2);border-right:1px solid var(--border);min-height:0}
.setsearch{position:relative}
.setsearch input{width:100%;box-sizing:border-box;height:34px;padding:0 10px 0 32px;border-radius:8px;border:1px solid var(--border);background:var(--bar);color:var(--text);font:inherit;font-size:13px}
.setsearch input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.setsearch svg{position:absolute;left:9px;top:9px;width:16px;height:16px;color:var(--muted);pointer-events:none}
#setNav{display:flex;flex-direction:column;gap:2px;overflow:auto}
.setnav-i{position:relative;display:flex;align-items:center;gap:10px;height:38px;padding:0 12px;border-radius:8px;color:var(--text);font-size:13.5px;text-align:left;white-space:nowrap}
.setnav-i svg{width:18px;height:18px;color:var(--muted)}
.setnav-i:hover{background:var(--hover)}
.setnav-i.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.setnav-i.on svg{color:var(--accent)}
.setnav-i.on::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.setver{margin-top:auto;padding:8px 12px;font-size:11.5px;color:var(--muted)}
.setmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.sethead{display:flex;align-items:center;gap:10px;padding:14px 18px 12px 24px;border-bottom:1px solid var(--border);flex:none}
.sethead h2{margin:0;flex:1;font-size:17px;font-weight:700}
.setbody{flex:1;overflow:auto;padding:18px 24px 28px;font-size:13.5px;line-height:1.55;scrollbar-width:thin}
.setg{padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--border)}
.setg:last-child{border-bottom:0;margin-bottom:0}
.setg h3{margin:0 0 4px;font-size:14.5px}
.setd{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.setbody .sb{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600}
.setbody .sb:hover{background:var(--hover)}
.setbody .sb.pri{background:var(--accent);color:#000;border-color:transparent}
.setbody .sb.pri:hover{filter:brightness(1.08);background:var(--accent)}
.setbody .sb.bad{color:#ef5350}
.setbody .sb:disabled{opacity:.5;cursor:default}
.optcards{display:flex;gap:12px;flex-wrap:wrap}
.optcard{display:flex;flex-direction:column;gap:8px;width:168px;padding:10px;border-radius:12px;border:1.5px solid var(--border);background:var(--bar);text-align:left;color:var(--text)}
.optcard:hover{background:var(--hover)}
.optcard.on{border-color:var(--accent);background:var(--accent-bg)}
.optcard b{font-size:13px}
.optcard span.sub{font-size:11.5px;color:var(--muted)}
.pv{position:relative;display:grid;height:74px;border-radius:7px;border:1px solid var(--border);background:var(--view);overflow:hidden;gap:2px;padding:2px}
.pv i{display:block;border-radius:3px;background:var(--border)}
.pv .pv-t{background:var(--bar2)}
.pv .pv-tool{background:var(--accent);opacity:.75}
.pv .pv-main{background:var(--bar)}
.pv.top{grid-template-rows:9px 11px 1fr}
.pv.top .pv-t{grid-row:1}.pv.top .pv-tool{grid-row:2}.pv.top .pv-main{grid-row:3}
.pv.left{grid-template-columns:13px 1fr;grid-template-rows:9px 1fr}
.pv.left .pv-t{grid-column:1/-1;grid-row:1}.pv.left .pv-tool{grid-column:1;grid-row:2}.pv.left .pv-main{grid-column:2;grid-row:2}
.segs{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--bar);border:1px solid var(--border)}
.segs button{height:30px;padding:0 16px;border-radius:7px;font-size:13px;color:var(--text)}
.segs button.on{background:var(--accent-bg);color:var(--accent);font-weight:600}
.sktop{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.sktop p{flex:1;margin:0;color:var(--muted);font-size:12.5px}
.skgrp{margin:0 0 16px}
.skgrp>h4{margin:0 0 6px;padding:0 4px;font-size:11.5px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.skrow{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 10px;border-radius:9px;flex-wrap:wrap}
.skrow:hover{background:var(--hover)}
.skl{flex:1;min-width:140px;display:flex;flex-direction:column}
.skl b{font-weight:500}.skl span{font-size:11.5px;color:var(--muted)}
.skchip{display:inline-flex;align-items:center;gap:4px;min-width:112px;height:32px;padding:0 10px;justify-content:center;border-radius:8px;border:1px solid var(--border);background:var(--bar);color:var(--text);font-size:12.5px}
.skchip:hover{border-color:var(--accent)}
.skchip.rec{border-color:var(--accent);background:var(--accent-bg);color:var(--accent);animation:skp 1.1s ease-in-out infinite}
@keyframes skp{50%{box-shadow:0 0 0 3px var(--accent-bg)}}
.skchip.none{color:var(--muted);border-style:dashed}
.skchip kbd,.skpv kbd{font:inherit;font-size:11.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--border);border-bottom-width:2px;background:var(--bar2);color:var(--text)}
.skmini{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;color:var(--muted)}
.skmini:hover{background:var(--hover);color:var(--text)}
.skmini svg{width:15px;height:15px}
.skmini.ph{visibility:hidden;pointer-events:none}
.skwarn{flex-basis:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:8px;background:rgba(239,83,80,.12);color:var(--text);font-size:12.5px}
.sk-empty{padding:30px 0;text-align:center;color:var(--muted)}
.aboutcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--bar2)}
.aboutcard .lg{display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--accent-bg);color:var(--accent)}
.aboutcard .lg svg{width:28px;height:28px}
.aboutcard b{font-size:16px}.aboutcard .meta{color:var(--muted);font-size:12.5px}
.chlog details{border:1px solid var(--border);border-radius:10px;margin:0 0 8px;background:var(--bar2)}
.chlog summary{cursor:pointer;padding:9px 14px;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
.chlog summary::-webkit-details-marker{display:none}
.chlog summary::before{content:'›';display:inline-block;transition:transform .15s;color:var(--muted)}
.chlog details[open]>summary::before{transform:rotate(90deg)}
.chlog .cur{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-bg);color:var(--accent);font-weight:600}
.chlog .chg>summary{font-size:14px}
.chlog .chin{padding:0 10px 4px}
.chlog .chin details{background:var(--bar)}
.chlog ul{margin:0;padding:0 16px 12px 34px;color:var(--text)}
.chlog li{margin:3px 0;color:var(--muted)}
.fbform{display:flex;flex-direction:column;gap:10px}
.fbform label.l{font-size:12px;color:var(--muted);margin-bottom:-4px}
.fbform input[type=text],.fbform input[type=email],.fbform textarea,.adsearch{width:100%;box-sizing:border-box;border-radius:8px;border:1px solid var(--border);background:var(--bar);color:var(--text);font:inherit;padding:8px 11px}
.fbform input[type=text],.fbform input[type=email]{height:38px;padding:0 11px}
.fbform textarea{min-height:130px;resize:vertical;line-height:1.5}
.fbform input:focus,.fbform textarea:focus,.adsearch:focus{outline:2px solid var(--accent);outline-offset:-1px}
.catchips{display:flex;gap:6px;flex-wrap:wrap}
.catchips button{height:30px;padding:0 13px;border-radius:999px;border:1px solid var(--border);font-size:12.5px;color:var(--text)}
.catchips button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.fbform .chk{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px}
.fbrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fbnote{font-size:12.5px;color:var(--accent);min-height:18px}.fbnote.err{color:#ef5350}
.fbcount{margin-left:auto;font-size:11.5px;color:var(--muted)}
.adtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.adtop .adsearch{flex:1;min-width:140px;height:34px;padding:0 11px}
.fbitem{border:1px solid var(--border);border-radius:11px;background:var(--bar2);margin:0 0 8px;overflow:hidden}
.fbhead{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;text-align:left;color:var(--text)}
.fbhead:hover{background:var(--hover)}
.fbtag{flex:none;font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}
.fbst{flex:none;font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600}
.fbst.new{background:rgba(239,83,80,.16);color:#ef5350}.fbst.doing{background:var(--accent-bg);color:var(--accent)}.fbst.done{background:rgba(5,150,105,.18);color:#34d399}
.fbtt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbdt{flex:none;font-size:11.5px;color:var(--muted)}
.fbbody{padding:2px 14px 14px;border-top:1px solid var(--border)}
.fbmsg{white-space:pre-wrap;word-break:break-word;margin:10px 0}
.fbmeta{font-size:11.5px;color:var(--muted);word-break:break-all;margin:0 0 8px}
.fbbody textarea{width:100%;box-sizing:border-box;min-height:54px;border-radius:8px;border:1px solid var(--border);background:var(--bar);color:var(--text);font:inherit;padding:7px 10px;margin:4px 0 8px;resize:vertical}
@media (max-width:760px){
  .setw{padding:0}
  .setdlg{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;border-radius:0;border:0}
  .setnav{min-width:0;flex-direction:column;padding:8px 8px 4px;border-right:0;border-bottom:1px solid var(--border);gap:6px}
  #setNav{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .setnav-i{height:34px;padding:0 12px}.setnav-i.on::before{display:none}
  .setver{display:none}
  .setbody{padding:14px 14px 28px}.sethead{padding:10px 12px 10px 16px}
  .optcard{width:calc(50% - 6px)}
}
body.mobile #setBtn{display:none}

/* ════════════ 도구 모음 좌측 정렬 ════════════ */
#app.tb-left{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;grid-template-areas:"title title" "tabs tabs" "tool opt" "tool main" "pager pager"}
#app.tb-left>.titlebar{grid-area:title}
#app.tb-left>.tabbar{grid-area:tabs}
#app.tb-left>.toolbar{grid-area:tool}
#app.tb-left>.optbar{grid-area:opt;min-width:0}
#app.tb-left>.main{grid-area:main;min-width:0;min-height:0}
#app.tb-left>.mpager{grid-area:pager}
#app.tb-left>.toolbar{flex-direction:column;align-items:stretch;gap:2px;width:62px;padding:8px 6px;border-bottom:0;border-right:1px solid var(--border);overflow-x:hidden;overflow-y:auto}
#app.tb-left>.toolbar .tool{min-width:0;width:100%;height:46px;padding:0;gap:0}
#app.tb-left>.toolbar .tool span{display:none}
#app.tb-left>.toolbar .tool svg{width:21px;height:21px}
#app.tb-left>.toolbar .sep{width:28px;height:1px;margin:5px auto}
#app.tb-left>.toolbar .spacer{flex:1 1 auto;min-width:0!important;min-height:10px}
#app.tb-left>.toolbar .splitbtn{flex-direction:column}
#app.tb-left>.toolbar .splitbtn .tool{border-radius:10px 10px 0 0}
#app.tb-left>.toolbar .caret{width:100%;height:16px;border-radius:0 0 10px 10px}
#app.tb-left>.toolbar .tool kbd{top:2px;right:4px;font-size:9px}

/* ════════════ 모바일 가로보기: 페이지 패널을 왼쪽으로 ════════════ */
@media (orientation:landscape){
  body.mobile .titlebar{height:42px}
  body.mobile .main{flex-direction:row}
  body.mobile .stage{order:1;min-width:0;min-height:0}
  body.mobile #sidebar{order:0;flex:none;width:var(--mlw,116px);height:auto;border-top:0;border-right:1px solid var(--border);padding-left:env(safe-area-inset-left,0px)}
  body.mobile #sidebar>.thumbs{flex-direction:column;align-items:center;overflow-x:hidden;overflow-y:auto;padding:8px 6px 12px;gap:10px;scrollbar-width:thin}
  body.mobile #sidebar .thumb{width:76px}

async function keyApi(sb, path, method, data) {
  let token = null;
  try { const { data: d } = await sb.auth.getSession(); token = d && d.session && d.session.access_token; } catch (e) { /* 무시 */ }
  if (!token) return { success: false, message: '로그인이 필요합니다.' };
  if (!await findPayServer()) return { success: false, message: '서버를 찾을 수 없습니다. 서버(node server.js) 실행 여부를 확인해 주세요.' };
  try {
    const r = await fetch(payBase() + path, { method, headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' }, body: method === 'GET' ? undefined : JSON.stringify(data || {}) });
    return await r.json();
  } catch (e) { return { success: false, message: '서버에 연결할 수 없습니다.' }; }
}

async function overlayPng(p, only) {
  const s = Math.min(3, 4000 / Math.max(p.w, p.h));
  const c = document.createElement('canvas');
  c.width = Math.round(p.w * s); c.height = Math.round(p.h * s);
  const octx = c.getContext('2d');
  drawAnnots(octx, p.annots, c.width / p.w, { only });
  if (only !== 'hl') for (const m of p.memos || []) drawMemoCanvas(octx, m, c.width / p.w, 20 * c.width / p.w);
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  return new Uint8Array(await blob.arrayBuffer());
}
async function buildPdf() {
  finishEditor();

  state.pages.forEach(p => p.annots.forEach(a => { if (a.type === 'text') texts.push(a); }));
  await Promise.all(texts.map(t => document.fonts.load(fontStr(t), t.text).catch(() => {})));
  const out = await PDFDocument.create(), srcs = new Map();
  for (const p of state.pages) {
    let page, R = 0;
    if (p.src) {
      let sd = srcs.get(p.src.doc);
      if (!sd) { sd = await PDFDocument.load(state.docs.get(p.src.doc).bytes, { ignoreEncryption: true }); srcs.set(p.src.doc, sd); }
      [page] = await out.copyPages(sd, [p.src.index]);
      out.addPage(page);
      R = ((page.getRotation().angle % 360) + 360) % 360;
    } else page = out.addPage([p.w, p.h]);
    if (p.annots.length || (p.memos && p.memos.length)) {
      const b = page.getCropBox();
      let ax = b.x, ay = b.y;
      if (R === 90) ax = b.x + b.width;
      else if (R === 180) { ax = b.x + b.width; ay = b.y + b.height; }
      else if (R === 270) ay = b.y + b.height;
      if (p.annots.some(a => a.type === 'highlight' && !a.hidden)) {
        const hi = await out.embedPng(await overlayPng(p, 'hl'));
        page.drawImage(hi, { x: ax, y: ay, width: p.w, height: p.h, rotate: degrees(R), blendMode: BlendMode ? BlendMode.Multiply : undefined });
      }
      const img = await out.embedPng(await overlayPng(p, 'ink'));
      page.drawImage(img, { x: ax, y: ay, width: p.w, height: p.h, rotate: degrees(R) });
    }
    await new Promise(r => setTimeout(r, 0));
  }
  let an = 0;
  for (const p of state.pages) for (const a of p.annots) {
    if (a.type !== 'audio') continue;
    const au = state.audios.get(a.audioId); if (!au) continue;
    try { await out.attach(new Uint8Array(await au.blob.arrayBuffer()), `음성${++an}_${idxOf(p.id) + 1}쪽.${audExt(au.mime)}`, { mimeType: String(au.mime).split(';')[0], description: `${idxOf(p.id) + 1}쪽 음성 녹음` }); } catch (e) { console.warn(e); }
  }
  return out.save();
}

    if (n.nodeName === 'p:sp') await pptSp(n, ctx, out, tf);
    else if (n.nodeName === 'p:cxnSp') pptCxn(n, ctx, out, tf);
    else if (n.nodeName === 'p:pic') await pptPic(n, ctx, out, tf);
    else if (n.nodeName === 'p:grpSp') await pptGrp(n, ctx, out, tf);
    else if (n.nodeName === 'p:graphicFrame') pptFrame(n, ctx, out, tf);
  }
}
async function importPptx(file) {
  if (!await confirmDiscard()) return;
  showLoading('PPT를 가져오는 중…');
  try {
    const zip = await JSZip.loadAsync(await file.arrayBuffer());
    const pres = await pptXml(zip, 'ppt/presentation.xml'); if (!pres) throw new Error('presentation.xml 없음');
    const sz = pres.getElementsByTagName('p:sldSz')[0];
    const W = +sz.getAttribute('cx') / EMU, H = +sz.getAttribute('cy') / EMU;
    const presRels = await pptRels(zip, 'ppt/presentation.xml');
    const rids = [...pres.getElementsByTagName('p:sldId')].map(e => e.getAttribute('r:id'));
    const newImages = new Map(), imgCache = new Map(), docCache = new Map(), relCache = new Map();
    const mimes = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', bmp: 'image/bmp' };
    const getImage = async path => {
      if (imgCache.has(path)) return imgCache.get(path);
      const mime = mimes[path.split('.').pop().toLowerCase()], f = zip.file(path); let id = null;
      if (mime && f) {
        const dataUrl = `data:${mime};base64,${await f.async('base64')}`;
        try { const img = await loadImage(dataUrl); id = uid('img'); newImages.set(id, { img, dataUrl }); } catch (e) { /* 건너뜀 */ }
      }
      imgCache.set(path, id); return id;
    };
    const cdoc = async path => { if (!docCache.has(path)) docCache.set(path, await pptXml(zip, path)); return docCache.get(path); };
    const crel = async path => { if (!relCache.has(path)) relCache.set(path, await pptRels(zip, path)); return relCache.get(path); };
    const relOf = (rels, re) => [...rels.values()].find(r => re.test(r.type));
    const bgOf = (doc, ctx) => {
      const bg = doc && doc.getElementsByTagName('p:bg')[0]; if (!bg) return null;
      const bp = kid1(bg, 'p:bgPr'), sf = bp && kid1(bp, 'a:solidFill'), br = kid1(bg, 'p:bgRef');
      return (sf && pptColor(sf, ctx)) || (br && pptColor(br, ctx)) || null;
    };
    const pages = [], tf0 = { sx: 1, sy: 1, tx: 0, ty: 0 };
    for (let i = 0; i < rids.length; i++) {
      const rel = presRels.get(rids[i]); if (!rel) continue;
      showLoading(`PPT를 가져오는 중… (${i + 1}/${rids.length})`);
      const slide = await cdoc(rel.target); if (!slide) continue;
      const sRels = await crel(rel.target);
      let layout = null, master = null, lRels = new Map(), mRels = new Map(), theme = {}, clrMap = {};
      const lr = relOf(sRels, /\/slideLayout$/);
      if (lr) {
        layout = await cdoc(lr.target); lRels = await crel(lr.target);
        const mr = relOf(lRels, /\/slideMaster$/);
        if (mr) {
          master = await cdoc(mr.target); mRels = await crel(mr.target);
          const tr = relOf(mRels, /\/theme$/); if (tr) theme = themeColors(await cdoc(tr.target));
          const cm = master && master.getElementsByTagName('p:clrMap')[0];
          if (cm) for (const a of cm.attributes) clrMap[a.name] = a.value;
        }
      }
      const base = { theme, clrMap, getImage, layout, master };
      const out = [];
      const bgc = bgOf(slide, { ...base, rels: sRels }) || bgOf(layout, { ...base, rels: lRels }) || bgOf(master, { ...base, rels: mRels }) || '#ffffff';
      if (bgc.toLowerCase() !== '#ffffff') out.push({ id: uid('o'), type: 'rect', x: 0, y: 0, w: W, h: H, color: '#000000', width: 0, fill: bgc, fillAlpha: 1 });
      const showMaster = !(layout && layout.documentElement.getAttribute('showMasterSp') === '0');
      if (master && showMaster) { const t = master.getElementsByTagName('p:spTree')[0]; if (t) await pptTree(t, { ...base, template: true, rels: mRels }, out, tf0); }
      if (layout) { const t = layout.getElementsByTagName('p:spTree')[0]; if (t) await pptTree(t, { ...base, template: true, rels: lRels }, out, tf0); }
      const st = slide.getElementsByTagName('p:spTree')[0];
      if (st) await pptTree(st, { ...base, template: false, rels: sRels }, out, tf0);
      pages.push({ id: uid('p'), src: null, w: W, h: H, annots: out, memos: [], group: null });
    }
    if (!pages.length) throw new Error('슬라이드 없음');
    resetDocument();
    newImages.forEach((v, k) => state.images.set(k, v));
    state.pages = pages;
    setSaveFormat('pdf');
    afterLoad(baseName(file.name) + '.pdf');
    setDirty(true);
    toast(`슬라이드 ${pages.length}장을 가져왔어요. 글자·도형·그림은 개체로 편집할 수 있어요.`);
  } catch (err) { console.error(err); toast('PPTX 파일을 가져오지 못했어요. 손상되었거나 지원하지 않는 형식일 수 있어요.'); }
  finally { hideLoading(); }
}

function parsePageRange(str, total) {
  const t = String(str || '').trim();
  if (!t) return Array.from({ length: total }, (_, i) => i);
  const out = [];
  for (const part of t.split(/[,\s]+/).filter(Boolean)) {
    const m = /^(\d+)(?:\s*[-~]\s*(\d+))?$/.exec(part); if (!m) return null;
    let a = +m[1], b = m[2] ? +m[2] : a; if (a > b) [a, b] = [b, a];
    if (a < 1 || b > total) return null;
    for (let i = a; i <= b; i++) if (!out.includes(i - 1)) out.push(i - 1);
  }
  return out.length ? out : null;
}
async function renderPageCanvas(p) {
  const sc = Math.min(150 / 72, Math.sqrt(40e6 / (p.w * p.h)));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(p.w * sc)); c.height = Math.max(1, Math.round(p.h * sc));
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  const k = c.width / p.w;
  if (p.src) { const pg = await getPdfPage(p.src); await pg.render({ canvasContext: ctx, viewport: pg.getViewport({ scale: k }) }).promise; }
  drawAnnots(ctx, p.annots, k);
  for (const m of p.memos || []) drawMemoCanvas(ctx, m, k, 20 * k);
  return c;
}

async function printDocument() {

  const idxs = parsePageRange(r, total);
  if (!idxs) { toast(`페이지 범위를 확인해 주세요. 1~${total} 사이로, 예: 1-3, 5`); return; }

      const c = await renderPageCanvas(p);
      const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));

      img.src = url; root.appendChild(img); imgs.push(img);

  }

async function loadPdfSource(file) {

  const docId = uid('doc'), pages = [];

/* ── 병합 순서 대화상자 (드래그 또는 ▲▼ 로 순서 결정) ── */
function mergeOrderDialog(items, title) {
  const list = items.slice();
  let box, dragI = -1;
  const draw = () => {
    box.innerHTML = '';
    list.forEach((it, i) => {
      const row = document.createElement('div'); row.className = 'mrow'; row.draggable = true; row.dataset.i = i;
      row.innerHTML = `<span class="mgrip">${svg('grip')}</span><span class="mno">${i + 1}</span><span class="mname"></span><span class="msub"></span><span class="mbtns"><button type="button" data-d="-1" aria-label="위로" ${i === 0 ? 'disabled' : ''}>▲</button><button type="button" data-d="1" aria-label="아래로" ${i === list.length - 1 ? 'disabled' : ''}>▼</button></span>`;
      row.querySelector('.mname').textContent = it.name; row.querySelector('.msub').textContent = it.sub || '';
      if (it.cur) row.classList.add('cur');
      box.appendChild(row);
    });
  };
  const move = (from, to) => { if (from === to || to < 0 || to >= list.length) return; const [x] = list.splice(from, 1); list.splice(to, 0, x); draw(); };
  const clearMarks = () => box.querySelectorAll('.ins-b,.ins-a').forEach(r => r.classList.remove('ins-b', 'ins-a'));
  return customModal({
    title, wide: true,
    build(body) {
      const p = document.createElement('p'); p.textContent = '위에 있는 파일이 먼저 병합됩니다. 항목을 끌어서 순서를 바꿀 수 있습니다.'; body.appendChild(p);
      box = document.createElement('div'); box.className = 'mlist'; body.appendChild(box);
      box.addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (!b) return; const row = b.closest('.mrow'); const i = +row.dataset.i; move(i, i + +b.dataset.d); });
      box.addEventListener('dragstart', e => { const r = e.target.closest('.mrow'); if (!r) return; dragI = +r.dataset.i; e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', 'm'); } catch (er) { /* 무시 */ } r.classList.add('dragging'); });
      box.addEventListener('dragend', () => { dragI = -1; clearMarks(); box.querySelectorAll('.dragging').forEach(r => r.classList.remove('dragging')); });
      box.addEventListener('dragover', e => {
        if (dragI < 0) return; e.preventDefault();
        const r = e.target.closest('.mrow'); clearMarks(); if (!r) return;
        const bb = r.getBoundingClientRect(); r.classList.add(e.clientY > bb.top + bb.height / 2 ? 'ins-a' : 'ins-b');
      });
      box.addEventListener('drop', e => {
        if (dragI < 0) return; e.preventDefault();
        const r = e.target.closest('.mrow'); clearMarks(); if (!r) return;
        const bb = r.getBoundingClientRect(); let to = +r.dataset.i + (e.clientY > bb.top + bb.height / 2 ? 1 : 0);
        if (dragI < to) to--;
        move(dragI, to); dragI = -1;
      });
      draw();
    },
    buttons: [{ label: '취소', value: null }, { label: '병합하기', ok: true, value: () => list.map(x => x.key) }]
  });
}

function chlogHtml() {

  return groups.map((g, gi) => {

    const a = ymin(g.list[g.list.length - 1][0].v), b = ymin(g.list[0][0].v);
    const label = g.key === 'beta' ? 'beta' : a === b ? a : a + ' ~ ' + b;

async function sendFeedback() {

  try { if (Object.keys(localStorage).some(k => /^sb-.*-auth-token/.test(k))) { const sb = await getSb(); if (sb) { const { data } = await sb.auth.getSession(); token = data && data.session && data.session.access_token; } } } catch (e) { /* 로그인 없이 접수 */ }

  else {
    try {
      const r = await fetch(payBase() + '/api/feedback', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, token ? { Authorization: 'Bearer ' + token } : {}), body: JSON.stringify({ category: fb.cat, title: fb.title.trim(), message: msg, contact: fb.contact.trim(), appVersion: APP_VERSION, env: fb.env ? envStr() : '' }) });
      j = await r.json();
    } catch (e) { j = { success: false, message: '서버에 연결할 수 없습니다. 잠시 후 다시 시도하거나 아래 메일로 보내 주세요.' }; }
  }
  if (j && j.success) { const c = fb.contact; fb = fbDef(); fb.contact = c; fb.note = '접수되었습니다. 소중한 의견 감사합니다.'; }
  else { fb.busy = false; fb.note = (j && j.message) || '접수하지 못했습니다.'; fb.err = true; fb.mail = true; }

    if (fitMode === 'page' || fitMode === 'width' || fitMode === null && state.zoom <= 0) mFit();
    else { viewer.scrollTop = 0; viewer.scrollLeft = 0; }
    mWide();
  }
  const i = idxOf(id);
  $('#mPrev').disabled = i <= 0; $('#mNext').disabled = i >= state.pages.length - 1;
}
function mGo(id, dir) {
  if (!views.has(id)) return;
  finishEditor();
  const a = idxOf(state.currentId), b = idxOf(id);
  if (dir === undefined) dir = a === b ? 0 : (b > a ? 1 : -1);
  mLast = null;
  setCurrent(id);
  const el = views.get(id).el;
  if (dir && el.animate && !matchMedia('(prefers-reduced-motion: reduce)').matches)
    el.animate([{ transform: `translateX(${dir * 36}%)`, opacity: .15 }, { transform: 'translateX(0)', opacity: 1 }], { duration: 210, easing: 'cubic-bezier(.2,.8,.2,1)' });
}
const mStep = dir => { const i = idxOf(state.currentId), t = state.pages[clamp(i + dir, 0, state.pages.length - 1)]; if (t && t.id !== state.currentId) mGo(t.id, dir); };
function mWide() { document.body.classList.toggle('m-wide', mMode && viewer.scrollWidth > viewer.clientWidth + 4); }
new ResizeObserver(() => mWide()).observe($('#pages'));

/* 한 손가락 드래그 = 페이지 넘기기 · 두 손가락 = 확대/축소/이동 (옆 페이지가 손가락을 따라 함께 움직여요) */
const mPtr = new Map();
let mSw = null, mPinch = null, mBlock = false, mPRaf = 0;
const mCurEl = () => { const v = views.get(state.currentId); return v && v.el; };
function mNb(dir) { const t = state.pages[idxOf(state.currentId) + dir]; const v = t && views.get(t.id); return v ? { id: t.id, el: v.el } : null; }
function mClearNb() { for (const v of views.values()) if (v.el.classList.contains('m-nb')) { v.el.style.transform = ''; v.el.style.visibility = ''; } }
const mNbX = (nb, cur, dir, off) => `translateX(calc(-50% + ${off + dir * ((cur.offsetWidth + nb.el.offsetWidth) / 2 + 14)}px))`;
function mAnnotHit(e, pg) {
  const id = pg && pg.dataset.id, p = id && pageById(id), v = id && views.get(id); if (!p || !v) return null;
  return annotHitAt(p, pagePoint(e, v.over)) ? id : null;
}
const mFits = () => viewer.scrollWidth <= viewer.clientWidth + 4;
viewer.addEventListener('pointerdown', e => {
  if (!mMode || e.pointerType === 'mouse') return;
  mPtr.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mPtr.size === 2) {                         // 두 번째 손가락: 확대/축소/이동 시작 (진행 중이던 그리기·이동은 취소)
    e.stopPropagation(); mBlock = true;
    if (drag) cancelDrag(drag.id);
    if (mSw) { mClearNb(); const c = mCurEl(); if (c) c.style.transform = ''; mSw = null; }
    const [a, b] = [...mPtr.values()];
    mPinch = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: state.zoom, x0: (a.x + b.x) / 2, y0: (a.y + b.y) / 2, px: (a.x + b.x) / 2, py: (a.y + b.y) / 2, scaled: false, mx: 0, my: 0 };
    window.getSelection && window.getSelection().removeAllRanges();
    return;
  }
  if (mPtr.size > 2) { e.stopPropagation(); return; }
  if (state.tool !== 'select') { mSw = null; return; }
  const pg = e.target.closest && e.target.closest('.page');
  const hid = pg && mAnnotHit(e, pg);
  if (hid) { e.stopPropagation(); mBlock = true; mSw = null; onDown(e, hid); return; }   // 개체 선택·이동·글자 개체 수정
  mSw = { x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, on: false, nbDir: 0 };
}, true);
viewer.addEventListener('pointermove', e => {
  if (!mMode || e.pointerType === 'mouse' || !mPtr.has(e.pointerId)) return;
  mPtr.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (mPinch && mPtr.size >= 2) {
    e.stopPropagation();
    if (mPRaf) return;
    mPRaf = requestAnimationFrame(() => {
      mPRaf = 0; if (!mPinch || mPtr.size < 2) return;
      const [a, b] = [...mPtr.values()], d = Math.hypot(a.x - b.x, a.y - b.y) || 1, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, k = d / mPinch.d0;
      if (Math.abs(k - 1) > 0.1) mPinch.scaled = true;
      mPinch.mx = mx - mPinch.x0; mPinch.my = my - mPinch.y0;
      viewer.scrollLeft -= mx - mPinch.px; viewer.scrollTop -= my - mPinch.py;
      mPinch.px = mx; mPinch.py = my;
      setZoom(mPinch.z0 * k, { cx: mx, cy: my }, true); mWide();
    });
    return;
  }
  if (!mSw) return;
  const dx = e.clientX - mSw.x, dy = e.clientY - mSw.y;
  if (!mSw.on) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) { mSw = null; return; }
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy) * 1.15 && mFits()) {
      mSw.on = true; mBlock = true;
      window.getSelection && window.getSelection().removeAllRanges();
    } else return;
  }
  const cur = mCurEl(); if (!cur) return;
  const dir = dx < 0 ? 1 : -1, nb = mNb(dir);
  if (mSw.nbDir !== dir) { mClearNb(); mSw.nbDir = dir; if (nb) nb.el.style.visibility = 'visible'; }
  const off = nb ? dx : dx * 0.28;
  mSw.dx = dx;
  cur.style.transform = `translateX(${off}px)`;
  if (nb) nb.el.style.transform = mNbX(nb, cur, dir, off);
}, true);
function mEnd(e) {
  if (!mMode || e.pointerType === 'mouse') return;
  mPtr.delete(e.pointerId);
  if (mPinch) {
    if (mPtr.size >= 2) return;
    const pn = mPinch; mPinch = null;
    if (!mPtr.size) mBlock = false;
    const fz = mFitZoom(), near = fz && Math.abs(state.zoom - fz) / fz < 0.08;
    const flip = e.type === 'pointerup' && !pn.scaled && Math.abs(pn.mx) > 70 && Math.abs(pn.mx) > Math.abs(pn.my) * 1.6 && (near || mFits());
    if (near || flip) mFit();                       // 화면 맞춤 크기 근처에서 놓으면 딱 맞춰요
    if (flip) mStep(pn.mx < 0 ? 1 : -1);
    mWide(); return;
  }
  if (!mPtr.size) mBlock = false;
  const sw = mSw; mSw = null;
  if (!sw || !sw.on) return;
  const cur = mCurEl(); if (!cur) { mClearNb(); return; }
  const dx = sw.dx, dt = Math.max(1, performance.now() - sw.t), vel = Math.abs(dx) / dt;
  const dir = dx < 0 ? 1 : -1, nb = mNb(dir);
  const go = e.type === 'pointerup' && nb && (Math.abs(dx) > viewer.clientWidth * 0.18 || (Math.abs(dx) > 28 && vel > 0.35));
  const off = nb ? dx : dx * 0.28;
  const fin = (toCur, toNb, after) => {
    const dur = go ? 190 : 170, ease = 'cubic-bezier(.2,.8,.25,1)';
    const anims = [cur.animate([{ transform: `translateX(${off}px)` }, { transform: toCur }], { duration: dur, easing: ease, fill: 'forwards' })];
    if (nb) anims.push(nb.el.animate([{ transform: mNbX(nb, cur, dir, off) }, { transform: toNb }], { duration: dur, easing: ease, fill: 'forwards' }));
    let done = false;
    const end = () => { if (done) return; done = true; anims.forEach(a => a.cancel()); cur.style.transform = ''; mClearNb(); after && after(); };
    anims[0].onfinish = end; setTimeout(end, dur + 80);
  };
  if (!cur.animate) { cur.style.transform = ''; mClearNb(); if (go) mGo(nb.id, 0); return; }
  if (go) fin(`translateX(${-dir * ((cur.offsetWidth + nb.el.offsetWidth) / 2 + 14)}px)`, 'translateX(calc(-50% + 0px))', () => mGo(nb.id, 0));
  else fin('translateX(0px)', nb ? mNbX(nb, cur, dir, 0) : '', null);
}
viewer.addEventListener('pointerup', mEnd, true);
viewer.addEventListener('pointercancel', mEnd, true);
viewer.addEventListener('touchmove', e => { if (mMode && mBlock && e.cancelable) e.preventDefault(); }, { passive: false, capture: true });

$('#mPrev').onclick = () => mStep(-1);
$('#mNext').onclick = () => mStep(1);
$('#mList').onclick = () => app.classList.toggle('sidebar-off');
$('#mFitBtn').onclick = () => { fitMode = 'page'; mFit(); mWide(); };

/* 열기 모드 (보기 / 간편 수정 / 기본) */
const M_MODES = [['view', '보기', '읽기 전용 · 편집 도구 숨김'], ['simple', '간편 수정', '강조 · 그리기 · 도형 · 이미지 · 메모 (글자 수정 제외)'], ['full', '기본', '모든 편집 기능']];
let mNoTextAt = 0;
function mNoText() { if (mAccess === 'view' || performance.now() - mNoTextAt < 4000) return; mNoTextAt = performance.now(); toast('간편 수정 모드에서는 글자를 수정할 수 없어요.'); }
function mClasses() { document.body.classList.toggle('mv-view', mMode && mAccess === 'view'); document.body.classList.toggle('mv-simple', mMode && mAccess === 'simple'); }
function mSetAccess(m) {
  mAccess = M_MODES.some(x => x[0] === m) ? m : 'full'; mClasses();
  try { safeStore.setItem('meowMAccess', mAccess); } catch (e) { /* 무시 */ }
  if (mAccess !== 'full') { finishEditor(); if (state.tool !== 'select') setTool('select'); }
  if (mAccess === 'view' && state.selected) selectObj(null);
  if (state.pages.length) requestAnimationFrame(() => { mLast = null; mSync(); mFit(); });
}
function mPickMode() {
  return new Promise(resolve => {
    const old = $('#mModeDlg'); if (old) old.remove();
    const d = document.createElement('div'); d.id = 'mModeDlg'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', '열기 모드');
    let last = safeStore.getItem('meowMAccess'); if (!M_MODES.some(x => x[0] === last)) last = 'full';
    d.innerHTML = '<div class="mmd"><div class="mmd-h">어떻게 열까요?</div>' + M_MODES.map(([k, n, t]) => `<button data-m="${k}" class="${k === last ? 'on' : ''}"><b>${n}</b><span>${t}</span></button>`).join('') + '</div>';
    d.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) { d.remove(); resolve(b.dataset.m); } else if (e.target === d) { d.remove(); resolve(last); } });
    document.body.appendChild(d);
  });
}
{ const b = document.createElement('button'); b.id = 'mModeBtn'; b.hidden = true; b.onclick = async () => mSetAccess(await mPickMode()); document.body.appendChild(b); }
/* 더보기 메뉴 */
function mOpenMenu() {
  const nodoc = app.classList.contains('no-doc');
  const it = [
    ['user', PLAN.premium ? '프리미엄' : PLAN.user ? '무료' : '로그인', '#acctBtn'], ...(($('#fsBtn') && !$('#fsBtn').hidden) ? [['maximize', document.fullscreenElement ? '전체화면 해제' : '전체화면', '#fsBtn']] : []), ['folder', '파일 열기', '#openBtn'], ['filePlus', '새 문서', '#newBtn'],
    ['download', '다른 이름으로 저장', '#saveAsBtn', 1], ['search', 'PDF 전체에서 찾기', '#searchBtn', 1],
    ['eye', '보기 · 편집 모드', '#mModeBtn', 1], ['bookmark', '북마크 목록', '#bmNav', 1], ['translate', '페이지 번역', '#trBtn', 1], ['printer', '인쇄', '#printBtn', 1],
    ['settings', '설정', '#setBtn'], ['moon', '테마 전환', '#themeBtn']
  ].filter(x => !(x[3] && nodoc));
  const m = $('#mMenu');
  m.innerHTML = '<div class="msheet" role="menu"><div class="mgrab"></div>' + it.map((x, i) => `<button class="mitem" data-i="${i}" role="menuitem">${svg(x[0])}<span>${x[1]}</span></button>`).join('') + '</div>';
  m.hidden = false;
  m._items = it;
}
function mCloseMenu() { $('#mMenu').hidden = true; }
$('#mMoreBtn').onclick = mOpenMenu;
$('#mMenu').addEventListener('click', e => {
  const b = e.target.closest('.mitem');
  if (!b) { if (e.target === $('#mMenu')) mCloseMenu(); return; }
  const target = $('#mMenu')._items[+b.dataset.i][2];
  mCloseMenu();
  setTimeout(() => { const t = $(target); if (t) t.click(); }, 40);
});

function mApply(force) {
  const on = mMq.matches;
  if (on === mMode && !force) return;
  mMode = on;
  document.body.classList.toggle('mobile', on); mClasses();
  applyLayout();
  try { renderOptions(); } catch (e) { /* 무시 */ }
  if (on) {
    if (state.present) exitPresentation();
    if (vmodeOn()) setVMode(false);
    if (state.spread) setSpread(false);
    const tb = $('.titlebar'), more = $('#mMoreBtn');
    ['#undoBtn', '#redoBtn', '#acctBtn', '#saveBtn'].forEach(sel => { const el = $(sel); if (el) { if (sel !== '#acctBtn') el.classList.add('needs-doc'); mPlace(el, tb, more); } });
    const pg = $('.pager'); if (pg) { pg.classList.add('in-mpager'); mPlace(pg, $('#mPagerMid')); }
    mPlace($('#optbar'), $('#stage'));
    app.classList.add('layers-off'); app.classList.toggle('sidebar-off', !mLand.matches);
    mLast = null; fitMode = 'page';
    if (state.pages.length) { if (!state.currentId) setCurrent(state.pages[0].id); else mSync(); mFit(); }
    updateTitle();
  } else {
    mCloseMenu(); mRestore();
    const pg = $('.pager'); if (pg) pg.classList.remove('in-mpager');
    document.body.classList.remove('m-wide');
    for (const v of views.values()) { v.el.classList.remove('m-cur', 'm-nb'); v.el.style.transform = ''; v.el.style.opacity = ''; }
    if (window.innerWidth > 760) app.classList.remove('sidebar-off');
    if (window.innerWidth > 1000) app.classList.remove('layers-off');
    syncPanelBtns();
    if (state.pages.length) requestAnimationFrame(() => { fitWidth(1.5); const v = views.get(state.currentId); if (v) viewer.scrollTop = Math.max(0, v.el.offsetTop - 16); });
  }
}
mMq.addEventListener('change', () => mApply());
mLand.addEventListener('change', () => { if (mMode) { app.classList.toggle('sidebar-off', !mLand.matches); syncPanelBtns(); mLast = null; if (state.pages.length) requestAnimationFrame(() => { mSync(); mFit(); }); } });
new MutationObserver(() => { if (mMode) { mLast = null; mSync(); } }).observe($('#pages'), { childList: true });

if (window.innerWidth > 760) app.classList.remove('sidebar-off');
if (window.innerWidth > 1000) app.classList.remove('layers-off');
syncPanelBtns(); renderLayers(); setListView(false); renderNotes(); renderTabs(); renderWork(); syncImageBtn();
try { if (localStorage.getItem('meowVMode') === '1') setVMode(true); } catch (e) { /* ignore */ }
applyLayout();
tickClock(); setInterval(tickClock, 5000); setSaveFormat('pdf');
document.fonts && document.fonts.load('16px "Noto Sans KR"', '가나다ABC').then(() => redrawAll(), () => {});
setTool('select');
updateHistoryButtons();
updateTitle();
if (mMq.matches) mApply();
})();
</script>
